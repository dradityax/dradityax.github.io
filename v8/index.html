<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FTC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:#f4f1ea; font-family:Inter, system-ui, -apple-system, sans-serif; -webkit-user-select:none; user-select:none; }
  canvas.webgl { position:fixed; top:0; left:0; display:block; touch-action:none; }
  .ftc { position:fixed; top:1.35rem; right:1.5rem; z-index:10; pointer-events:none;
         font-size:.8rem; font-weight:600; letter-spacing:.35em; text-transform:uppercase;
         color:rgba(26,26,26,.55); }
</style>
</head>
<body>
<div class="ftc">FTC</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script>
(function(){
  // ---------- renderer / scene ----------
  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.className = 'webgl';
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf4f1ea);

  var camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 50);
  camera.position.set(0, 1.7, 4.6);
  camera.lookAt(0, 0.95, 0);

  scene.add(new THREE.HemisphereLight(0xfffaf0, 0xd8cfc0, 0.95));
  var sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(2.5, 5, 3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-3; sun.shadow.camera.right=3;
  sun.shadow.camera.top=4;  sun.shadow.camera.bottom=-1;
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xffe9d6, 0.35);
  fill.position.set(-3, 2, -2);
  scene.add(fill);

  // soft ground shadow only — page stays plain
  var ground = new THREE.Mesh(
    new THREE.CircleGeometry(2.4, 48),
    new THREE.ShadowMaterial({ opacity:0.16 })
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- materials ----------
  var FUR   = new THREE.MeshStandardMaterial({ color:0x26262b, roughness:0.85 });
  var CREAM = new THREE.MeshStandardMaterial({ color:0xf7f2e7, roughness:0.9 });
  var WHITE = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.35 });
  var INK   = new THREE.MeshStandardMaterial({ color:0x141416, roughness:0.3 });
  var PINK  = new THREE.MeshStandardMaterial({ color:0xd98a8a, roughness:0.8 });
  var VERM  = new THREE.MeshStandardMaterial({ color:0xe0492f, roughness:0.6 });

  function ball(r, mat, x, y, z, sx, sy, sz){
    var m = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 32), mat);
    m.position.set(x||0, y||0, z||0);
    m.scale.set(sx||1, sy||1, sz||1);
    m.castShadow = true;
    return m;
  }

  var cat = new THREE.Group();
  scene.add(cat);

  // ---------- body (sitting) ----------
  var body = ball(0.55, FUR, 0, 0.66, 0, 1, 1.12, 0.92);
  cat.add(body);
  cat.add(ball(0.40, CREAM, 0, 0.60, 0.36, 0.72, 0.95, 0.55));       // chest patch
  cat.add(ball(0.28, FUR, -0.44, 0.30, -0.05));                       // haunches
  cat.add(ball(0.28, FUR,  0.44, 0.30, -0.05));

  [-1,1].forEach(function(s){
    var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.095, 0.5, 20), FUR);
    leg.position.set(0.20*s, 0.30, 0.42); leg.castShadow = true; cat.add(leg);
    cat.add(ball(0.10, FUR, 0.20*s, 0.075, 0.46, 1, 0.75, 1.25));     // paws
  });

  // ---------- tail (wags!) ----------
  var tail = new THREE.Group();
  tail.position.set(0, 0.42, -0.50);
  var tailSegs = [];
  for (var i=0; i<6; i++){
    var r = 0.115 - i*0.008;
    var seg = ball(r, FUR, 0.30*(1-Math.cos(i*0.55)), i*0.17, -0.06*i);
    tail.add(seg); tailSegs.push(seg);
  }
  tail.add(ball(0.075, CREAM, 0.30*(1-Math.cos(5*0.55)), 5*0.17+0.05, -0.06*5)); // tip
  cat.add(tail);

  // ---------- head ----------
  var head = new THREE.Group();
  head.position.set(0, 1.50, 0.08);
  cat.add(head);
  head.add(ball(0.40, FUR, 0, 0, 0));

  // ears
  var earL = new THREE.Group(), earR = new THREE.Group();
  [[-1,earL],[1,earR]].forEach(function(pair){
    var s = pair[0], g = pair[1];
    var outer = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.32, 24), FUR);
    outer.castShadow = true;
    var inner = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.16, 20), PINK);
    inner.position.set(0, -0.02, 0.075);
    g.add(outer); g.add(inner);
    g.position.set(0.24*s, 0.36, -0.02);
    g.rotation.z = -0.28*s;
    head.add(g);
  });

  // muzzle + nose
  head.add(ball(0.16, CREAM, 0, -0.10, 0.34, 1.35, 0.8, 0.8));
  var nose = ball(0.045, VERM, 0, -0.055, 0.465, 1.25, 0.8, 0.8);
  head.add(nose);

  // whiskers
  var whiskMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.75 });
  [-1,1].forEach(function(s){
    for (var w=0; w<3; w++){
      var wh = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.36, 6), whiskMat);
      wh.position.set(0.32*s, -0.03 - w*0.055, 0.38);
      wh.rotation.z = Math.PI/2 + s*(0.18 - w*0.16);
      wh.rotation.y = s*0.25;
      head.add(wh);
    }
  });

  // ---------- eyes (follow the cursor, like the TV mascot) ----------
  var pupils = [], eyeWhites = [], highlights = [];
  [-1,1].forEach(function(s){
    var eye = new THREE.Group();
    eye.position.set(0.155*s, 0.07, 0.325);
    var sclera = ball(0.105, WHITE, 0, 0, 0);
    var pupil  = ball(0.052, INK, 0, 0, 0.068);
    var hl     = ball(0.016, WHITE, 0.02, 0.02, 0.048);
    pupil.add(hl);
    eye.add(sclera); eye.add(pupil);
    head.add(eye);
    pupils.push(pupil); eyeWhites.push(sclera); highlights.push(hl);
  });

  // ---------- pointer ----------
  var pointer = { x:0, y:0 };
  function onMove(cx, cy){
    pointer.x = (cx / innerWidth) * 2 - 1;
    pointer.y = -((cy / innerHeight) * 2 - 1);
  }
  addEventListener('pointermove', function(e){ onMove(e.clientX, e.clientY); });
  addEventListener('touchmove', function(e){
    if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });

  // tap = excited tail wag
  var excitement = 0;
  addEventListener('pointerdown', function(){ excitement = 1; });

  // ---------- animation ----------
  var clock = new THREE.Clock();
  var t = 0, blinkTimer = 2.5, blinking = 0, twitchTimer = 4, twitchEar = null, twitchT = 0;
  var pupilPos = { x:0, y:0 }, headRot = { x:0, y:0 };

  function animate(){
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    t += dt;

    // tail wag (faster when excited)
    excitement = Math.max(0, excitement - dt*0.5);
    var wagSpeed = 2.2 + excitement*6, wagAmp = 0.45 + excitement*0.35;
    tail.rotation.y = Math.sin(t*wagSpeed) * wagAmp;
    tail.rotation.x = Math.sin(t*1.3) * 0.08;

    // breathing
    body.scale.y = 1.12 + Math.sin(t*2)*0.012;
    head.position.y = 1.50 + Math.sin(t*2)*0.008;

    // eyes follow cursor
    var tx = Math.max(-1, Math.min(1, pointer.x)) * 0.045;
    var ty = Math.max(-1, Math.min(1, pointer.y)) * 0.035;
    pupilPos.x += (tx - pupilPos.x) * 0.18;
    pupilPos.y += (ty - pupilPos.y) * 0.18;
    pupils.forEach(function(p){ p.position.x = pupilPos.x; p.position.y = pupilPos.y; });

    // head turns slightly toward cursor
    headRot.y += (pointer.x*0.18 - headRot.y) * 0.06;
    headRot.x += (-pointer.y*0.10 - headRot.x) * 0.06;
    head.rotation.y = headRot.y;
    head.rotation.x = headRot.x;

    // blink
    blinkTimer -= dt;
    if (blinkTimer <= 0){ blinking = 0.12; blinkTimer = 2.5 + Math.random()*3; }
    var eyeSY = 1;
    if (blinking > 0){ blinking -= dt; eyeSY = 0.12; }
    eyeWhites.forEach(function(e){ e.scale.y = eyeSY; });
    pupils.forEach(function(p){ p.scale.y = eyeSY; });

    // occasional ear twitch
    twitchTimer -= dt;
    if (twitchTimer <= 0 && !twitchEar){
      twitchEar = Math.random() < 0.5 ? earL : earR;
      twitchT = 0.25; twitchTimer = 3 + Math.random()*4;
    }
    if (twitchEar){
      twitchT -= dt;
      var k = Math.sin((0.25-twitchT)/0.25 * Math.PI);
      twitchEar.rotation.x = -0.35 * k;
      if (twitchT <= 0){ twitchEar.rotation.x = 0; twitchEar = null; }
    }

    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', function(){
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
