<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Story</title>
<style>
  :root{--ink:#141312;--cream:#f6f1e7;--card:#fffdf7;--red:#c93a2e;--muted:#6b6862}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  a{color:inherit}
  /* ---------- Password lock ---------- */
  #lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#141312;color:#f6f1e7;padding:24px}
  #lock.hidden{display:none}
  .lock-card{width:min(420px,100%);text-align:center}
  .lock-kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
  .lock-card h1{font-size:30px;line-height:1.1;margin:12px 0 8px}
  .lock-card p{font-size:14px;line-height:1.6;opacity:.85;margin:0 0 18px}
  .lock-card input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:16px;outline:none}
  .lock-card button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;background:#f6f1e7;color:#141312;font-size:16px;font-weight:700;cursor:pointer}
  #lockError{display:none;margin-top:10px;font-size:13px;color:#ff9a8a}
  /* ---------- Story reading ---------- */
  #story{max-width:720px;margin:0 auto;padding:28px 20px 80px;display:none}
  #story.show{display:block}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
  .topbar .brand{font-weight:800;letter-spacing:.02em}
  .topbar .hint{font-size:12px;color:var(--muted)}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);font-weight:700}
  h1.story-title{font-size:clamp(32px,6vw,48px);line-height:1.02;letter-spacing:-.02em;margin:10px 0 8px}
  .story-sub{font-size:15px;line-height:1.65;color:#3a3936;max-width:60ch;margin:0 0 8px}
  .progress{height:3px;background:rgba(20,19,18,.12);border-radius:99px;overflow:hidden;margin:22px 0 8px;position:sticky;top:0;z-index:5}
  .progress > div{height:100%;width:0;background:var(--red);transition:width .15s linear}
  .frame{border-top:1px solid rgba(20,19,18,.14);padding:28px 0 8px;margin-top:28px}
  .frame:first-of-type{border-top:0}
  .frame-time{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700}
  .frame-title{font-size:22px;line-height:1.25;margin:8px 0 0;letter-spacing:-.01em}
  .frame-body{white-space:pre-line;line-height:1.9;font-size:17px;margin-top:14px}
  .frame-nav{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
  .frame-nav button{padding:11px 16px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;font-weight:700;cursor:pointer}
  .frame-nav button:disabled{opacity:.35;cursor:default}
  .end-note{margin-top:48px;padding-top:22px;border-top:1px solid rgba(20,19,18,.14);font-size:14px;line-height:1.7;color:var(--muted)}
  @media (max-width:560px){ #story{padding:22px 16px 72px} .frame-body{font-size:16px} }
</style>
</head>
<body>

<!-- Lock: nothing below renders until correct password decrypts story.enc.json -->
<div id="lock">
  <div class="lock-card">
    <h1>Story</h1>
    <form id="lockForm">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Unlock Story</button>
      <div id="lockError">Wrong password. Try again.</div>
    </form>
  </div>
</div>

<!-- Reader: empty shell until decrypt succeeds -->
<main id="story" aria-live="polite">
  <h1 class="story-title" id="storyTitle">Story</h1>
  <div class="progress"><div id="progressBar"></div></div>
  <div id="frames"></div>
  <div class="frame-nav">
    <button id="prevBtn" type="button">← Previous frame</button>
    <button id="nextBtn" type="button">Next frame →</button>
  </div>
</main>

<script>
(function(){
  var lockEl = document.getElementById("lock");
  var storyEl = document.getElementById("story");
  var framesEl = document.getElementById("frames");
  var progressBar = document.getElementById("progressBar");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var current = 0;
  var frames = [];

  function b64ToBytes(s){
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function escapeHtml(s){
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function showFrame(i){
    if(!frames.length) return;
    current = Math.max(0, Math.min(frames.length-1, i));
    var f = frames[current];
    framesEl.innerHTML = '<section class="frame"><div class="frame-time">'+escapeHtml(f.timeLabel||"")+'</div><h2 class="frame-title">'+escapeHtml(f.title||"")+'</h2><div class="frame-body">'+escapeHtml(f.body||"")+'</div></section>';
    prevBtn.disabled = current===0;
    nextBtn.disabled = current===frames.length-1;
    progressBar.style.width = ((current+1)/frames.length*100)+"%";
    window.scrollTo({top:0, behavior:"smooth"});
  }
  prevBtn.addEventListener("click", function(){ showFrame(current-1); });
  nextBtn.addEventListener("click", function(){ showFrame(current+1); });

  document.getElementById("lockForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    var err = document.getElementById("lockError");
    err.style.display = "none";
    try{
      var r = await fetch("story.enc.json", {cache:"no-store"});
      if(!r.ok) throw new Error("Story file not found");
      var enc = await r.json();
      // PBKDF2 + AES-256-GCM.
      var baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt: b64ToBytes(enc.salt), iterations: enc.iterations, hash:"SHA-256"}, baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      var buf = await crypto.subtle.decrypt({name:"AES-GCM", iv: b64ToBytes(enc.iv)}, key, b64ToBytes(enc.data));
      var data = JSON.parse(new TextDecoder().decode(buf));
      frames = data.frames || [];
      if(!frames.length) throw new Error("Empty story");
      lockEl.classList.add("hidden");
      storyEl.classList.add("show");
      showFrame(0);
      // Clear password from memory as soon as possible.
      pw = "";
      document.getElementById("pw").value = "";
    }catch(_){
      err.style.display = "block";
    }
  });
})();
</script>
</body>
</html>
