<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mascot — Aditya X</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  .stage{font-size:clamp(140px,34vw,240px);line-height:1}
  /* ---- cute X : copied from homepage ---- */
  .xslot{position:relative;display:inline-block;width:.78em;height:.72em;vertical-align:baseline}
  .dx{position:absolute;inset:0}
  .dx .ln{position:absolute;top:0;left:50%;width:.17em;height:100%;background:#fff;
   border-radius:50%;box-shadow:0 0 12px rgba(255,255,255,.25);transform-origin:center}
  .dx .l1{transform:translateX(-.20em) scaleY(.236)}
  .dx .l2{transform:translateX(.20em) scaleY(.236)}
  .dx .glasses{position:absolute;inset:0;opacity:0;transform:scale(.6);transform-origin:center;
   transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
  .dx .glasses.show{opacity:1;transform:scale(1)}
  .dx .rim{position:absolute;top:50%;left:50%;width:.26em;height:.26em;border:.04em solid #fff;
   border-radius:50%;box-shadow:0 0 10px rgba(255,255,255,.3)}
  .dx .r1{transform:translate(-50%,-50%) translateX(-.20em)}
  .dx .r2{transform:translate(-50%,-50%) translateX(.20em)}
  .dx .bridge{position:absolute;top:50%;left:50%;width:.18em;height:.04em;background:#fff;
   border-radius:.02em;transform:translate(-50%,-50%)}
  .dx .book{position:absolute;left:50%;bottom:-4%;width:.48em;height:.26em;
   transform:translateX(-50%) scale(0);transform-origin:center bottom;
   transition:transform .45s cubic-bezier(.2,1.5,.4,1);pointer-events:none}
  .dx .book.open{transform:translateX(-50%) scale(1)}
  .dx .page{position:absolute;top:0;width:50%;height:100%;
   background:repeating-linear-gradient(to bottom,#f7f2e7 0 .045em,#d9d4c4 .045em .06em);
   box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .dx .p1{left:0;transform:skewY(-7deg);transform-origin:right center;border-radius:.02em 0 0 .05em}
  .dx .p2{right:0;transform:skewY(7deg);transform-origin:left center;border-radius:0 .02em .05em 0}
  @media (prefers-reduced-motion:reduce){
   .dx .l1{transform:translateX(-50%) rotate(40deg) scaleY(1)}
   .dx .l2{transform:translateX(-50%) rotate(-40deg) scaleY(1)}
  }
</style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <span class="xslot"><span class="dx"><span class="ln l1" id="dx1"></span><span class="ln l2" id="dx2"></span><span class="glasses" id="dxg"><span class="rim r1"></span><span class="rim r2"></span><span class="bridge"></span></span><span class="book" id="dxb"><span class="page p1"></span><span class="page p2"></span></span></span></span>
  </div>
<script>
(function(){
"use strict";
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var dx1=document.getElementById('dx1'), dx2=document.getElementById('dx2');
var dxg=document.getElementById('dxg'), dxb=document.getElementById('dxb');

var DX_DOT1="translateX(-.20em) scaleY(.236)", DX_DOT2="translateX(.20em) scaleY(.236)";
var DX_BLINK1="translateX(-.20em) scaleY(.02)", DX_BLINK2="translateX(.20em) scaleY(.02)";
var DX_LINE1="translateX(-.20em) scaleY(1)", DX_LINE2="translateX(.20em) scaleY(1)";
var DX_X1="translateX(-50%) rotate(40deg) scaleY(1)", DX_X2="translateX(-50%) rotate(-40deg) scaleY(1)";

function dxSet(el,tf,ms,ease){
  el.style.transition="transform "+ms+"ms "+(ease||"ease-in-out");
  el.style.transform=tf;
  return new Promise(function(r){ setTimeout(r, reduce?0:ms); });
}
function dxBlink(){
  return Promise.all([dxSet(dx1,DX_BLINK1,150,"ease-in"),dxSet(dx2,DX_BLINK2,150,"ease-in")])
    .then(function(){ return Promise.all([dxSet(dx1,DX_DOT1,200,"ease-out"),dxSet(dx2,DX_DOT2,200,"ease-out")]); });
}
function dxGlasses(){
  dxg.classList.add("show");
  return new Promise(function(r){ setTimeout(r, 700); })
    .then(dxBlink)
    .then(function(){ return new Promise(function(r){ setTimeout(r, 2200); }); })
    .then(function(){ dxg.classList.remove("show"); return new Promise(function(r){ setTimeout(r, 450); }); });
}
function dxRead(){
  dxb.classList.add("open");
  return new Promise(function(r){ setTimeout(r, 550); }).then(function(){
    var p=Promise.resolve();
    for(var i=0;i<3;i++){
      p=p.then(function(){
        return Promise.all([dxSet(dx1,"translateX(-.14em) scaleY(.236)",380),dxSet(dx2,"translateX(.26em) scaleY(.236)",380)]);
      }).then(function(){
        return Promise.all([dxSet(dx1,"translateX(-.26em) scaleY(.236)",380),dxSet(dx2,"translateX(.14em) scaleY(.236)",380)]);
      });
    }
    return p;
  }).then(function(){
    return Promise.all([dxSet(dx1,DX_DOT1,320),dxSet(dx2,DX_DOT2,320)]);
  }).then(function(){ return new Promise(function(r){ setTimeout(r, 350); }); })
    .then(function(){ dxb.classList.remove("open"); return new Promise(function(r){ setTimeout(r, 500); }); });
}
/* fully automatic loop — exactly like the homepage */
var dxN=0;
async function dxLoop(){
  while(true){
    dxN++;
    await new Promise(function(r){ setTimeout(r, 2800); });
    for(var i=0;i<2;i++){ await dxBlink(); await new Promise(function(r){ setTimeout(r, i<1?1200:2200); }); }
    if(dxN%4===2){ await dxGlasses(); }
    else if(dxN%4===0){ await dxRead(); }
    await new Promise(function(r){ setTimeout(r, 1500); });
    await Promise.all([ dxSet(dx1, DX_LINE1, 1100), dxSet(dx2, DX_LINE2, 1100) ]);
    await new Promise(function(r){ setTimeout(r, 900); });
    await Promise.all([
      dxSet(dx1, DX_X1, 1500, "cubic-bezier(.3,1.2,.4,1)"),
      dxSet(dx2, DX_X2, 1500, "cubic-bezier(.3,1.2,.4,1)")
    ]);
    await new Promise(function(r){ setTimeout(r, 8000); });
    await Promise.all([ dxSet(dx1, DX_LINE1, 1300), dxSet(dx2, DX_LINE2, 1300) ]);
    await new Promise(function(r){ setTimeout(r, 700); });
    await Promise.all([ dxSet(dx1, DX_DOT1, 1100), dxSet(dx2, DX_DOT2, 1100) ]);
  }
}
setTimeout(function(){ if(!reduce) dxLoop(); }, 1500);
})();
</script>
</body>
</html>
