<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mainframe — Creative Agency</title>
<meta name="description" content="Mainframe is a creative agency. Pitch us an idea.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='white'%3E%E2%9C%B3%EF%B8%8E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium">
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg">
<style>
:root{
  --font-heading:'HelveticaNowDisplay-Medium','Helvetica Neue',Arial,sans-serif;
  --font-body:'HelveticaNowDisplayW01-Rg','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-body);background:#000;color:#fff;overflow-x:hidden}
#bgVideo{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:70% center;display:block}
/* ---------- navbar ---------- */
.navbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
@media(min-width:640px){.navbar{padding:20px 32px}}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-text{font-family:var(--font-heading);font-size:21px;letter-spacing:-0.025em;color:#fff;white-space:nowrap}
@media(min-width:640px){.logo-text{font-size:26px}}
.logo-star{font-size:25px;color:#fff;user-select:none;-webkit-user-select:none;letter-spacing:-0.02em;line-height:1}
@media(min-width:640px){.logo-star{font-size:30px}}
.nav-links{display:none}
@media(min-width:768px){.nav-links{display:flex;align-items:center;font-size:23px}}
.nav-links a{color:#fff;text-decoration:none;transition:opacity .2s}
.nav-links a:hover{opacity:.6}
.nav-links .comma{color:#fff;margin:0 3px}
.desktop-cta{display:none}
@media(min-width:768px){.desktop-cta{display:inline-block;font-size:23px;color:#fff;text-decoration:underline;text-underline-offset:2px;transition:opacity .2s}}
.desktop-cta:hover{opacity:.6}
.hamburger{display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:8px;margin:-8px;cursor:pointer}
@media(min-width:768px){.hamburger{display:none}}
.hamburger span{display:block;width:24px;height:2px;background:#fff;transition:transform .3s,opacity .3s}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translateY(7px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translateY(-7px)}
/* ---------- mobile overlay ---------- */
.mobile-overlay{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 32px;gap:32px;opacity:0;pointer-events:none;transition:opacity .3s}
.mobile-overlay.open{opacity:1;pointer-events:auto}
@media(min-width:768px){.mobile-overlay{display:none}}
.mobile-overlay a{color:#fff;text-decoration:none;font-size:32px;font-weight:500}
.mobile-overlay a.cta{text-decoration:underline}
/* ---------- hero ---------- */
.hero{position:relative;z-index:1;height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 48px;overflow:hidden}
@media(min-width:640px){.hero{padding-left:32px;padding-right:32px}}
@media(min-width:768px){.hero{justify-content:center;padding-top:0;padding-bottom:0;padding-left:40px;padding-right:40px}}
.hero-inner{max-width:36rem;position:relative;z-index:10}
.intro-label{pointer-events:none;user-select:none;-webkit-user-select:none;margin:0 0 20px;font-size:clamp(18px,4vw,26px);line-height:1.3;font-weight:400;color:#fff;filter:blur(4px)}
@media(min-width:640px){.intro-label{margin-bottom:24px}}
.type-line{margin:0 0 20px;color:#fff;font-size:clamp(18px,4vw,26px);line-height:1.35;font-weight:400;min-height:54px}
@media(min-width:640px){.type-line{margin-bottom:24px}}
.cursor{display:inline-block;width:2px;height:1.1em;background:#fff;vertical-align:middle;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pills{display:flex;flex-wrap:wrap;row-gap:4px;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
.pills.visible{opacity:1;transform:translateY(0)}
.pill{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#000;border:1px solid rgba(0,0,0,.1);border-radius:9999px;font-family:var(--font-body);font-size:13px;padding:.3em 16px;margin:0 .2em .4em;white-space:nowrap;cursor:pointer;transition:background-color .2s,color .2s}
@media(min-width:640px){.pill{font-size:15px;padding-left:20px;padding-right:20px}}
.pill:hover{background:#000;color:#fff}
.pill-outline{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#fff;border:1px solid #fff;border-radius:9999px;font-family:var(--font-body);font-size:13px;padding:.3em 16px;margin:0 .2em .4em;white-space:nowrap;cursor:pointer;transition:background-color .2s,color .2s}
@media(min-width:640px){.pill-outline{font-size:15px;padding-left:20px;padding-right:20px;gap:12px}}
.pill-outline:hover{background:#fff;color:#000}
.pill-outline u{text-underline-offset:1px}
.pill-outline svg{flex:none;display:block}
</style>
</head>
<body>
<video id="bgVideo" src="/try-2/hero-scrub.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

<nav class="navbar">
  <a class="logo" href="#" aria-label="Mainframe home">
    <span class="logo-text">Mainframe®</span>
    <span class="logo-star" aria-hidden="true">✳︎</span>
  </a>
  <div class="nav-links">
    <a href="#">Labs</a><span class="comma">,</span><a href="#">Studio</a><span class="comma">,</span><a href="#">Openings</a><span class="comma">,</span><a href="#">Shop</a>
  </div>
  <a class="desktop-cta" href="#">Get in touch</a>
  <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
</nav>

<div class="mobile-overlay" id="mobileOverlay">
  <a href="#">Labs</a>
  <a href="#">Studio</a>
  <a href="#">Openings</a>
  <a href="#">Shop</a>
  <a href="#" class="cta">Get in touch</a>
</div>

<main class="hero">
  <div class="hero-inner">
    <p class="intro-label">Hey there, meet A.R.I.A,<br>Mainframe's Adaptive Response Interface Agent</p>
    <p class="type-line"><span id="typed"></span><span class="cursor" id="cursor"></span></p>
    <div class="pills" id="pills">
      <button class="pill" type="button">Pitch us an idea</button>
      <button class="pill" type="button">Come work here</button>
      <button class="pill" type="button">Send a brief hello</button>
      <button class="pill" type="button">See how we operate</button>
      <button class="pill-outline" type="button" id="copyPill"><span id="copyLabel">Reach us: <u>hello@mainframe.co</u></span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';

  /* ---------- background video: horizontal mouse scrub ---------- */
  var video = document.getElementById('bgVideo');
  var SENSITIVITY = 0.8;
  var prevX = null, targetTime = 0, seeking = false;
  function doSeek() {
    if (seeking) return;
    if (Math.abs(video.currentTime - targetTime) < 1e-3) return;
    seeking = true;
    try { video.currentTime = targetTime; }
    catch (e) { seeking = false; }
  }
  video.addEventListener('seeked', function () {
    seeking = false;
    if (Math.abs(video.currentTime - targetTime) > 1e-3) doSeek(); // queued seek
  });
  window.addEventListener('mousemove', function (e) {
    if (prevX === null) { prevX = e.clientX; return; }
    var delta = e.clientX - prevX;
    prevX = e.clientX;
    var dur = video.duration;
    if (!dur || !isFinite(dur)) return;
    targetTime += (delta / window.innerWidth) * SENSITIVITY * dur;
    if (targetTime < 0) targetTime = 0;
    if (targetTime > dur) targetTime = dur;
    doSeek();
  }, { passive: true });

  /* ---------- typewriter ---------- */
  var text = 'Glad you stopped in. Good taste tends to find us. Now, what are we building?';
  var speed = 38, startDelay = 600;
  var typedEl = document.getElementById('typed');
  var cursorEl = document.getElementById('cursor');
  var i = 0;
  setTimeout(function () {
    var iv = setInterval(function () {
      i++;
      typedEl.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(iv);
        if (cursorEl) cursorEl.remove();
      }
    }, speed);
  }, startDelay);

  /* ---------- pills reveal (400ms after load, independent of typing) ---------- */
  setTimeout(function () {
    document.getElementById('pills').classList.add('visible');
  }, 400);

  /* ---------- mobile menu ---------- */
  var burger = document.getElementById('hamburger');
  var overlay = document.getElementById('mobileOverlay');
  function setMenu(open) {
    burger.classList.toggle('open', open);
    overlay.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.body.style.overflow = open ? 'hidden' : '';
  }
  burger.addEventListener('click', function () {
    setMenu(!overlay.classList.contains('open'));
  });
  overlay.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { setMenu(false); });
  });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setMenu(false);
  });

  /* ---------- copy email pill ---------- */
  var copyBtn = document.getElementById('copyPill');
  var copyLabel = document.getElementById('copyLabel');
  var copyTimer = null;
  var email = 'hello@mainframe.co';
  function showCopied() {
    copyLabel.textContent = 'Copied to clipboard';
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () {
      copyLabel.innerHTML = 'Reach us: <u>hello@mainframe.co</u>';
    }, 1600);
  }
  function fallbackCopy() {
    var ta = document.createElement('textarea');
    ta.value = email;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    showCopied();
  }
  copyBtn.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).then(showCopied, fallbackCopy);
    } else {
      fallbackCopy();
    }
  });
})();
</script>
</body>
</html>
