<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Journal — Aditya X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS (untouched palette) ============ */
:root{
  --paper:#f5f4ef;
  --ink:#0f0f0e;
  --card-dark:#151515;
  --card-cream:#f9f6f1;
  --red:#ef5d44;
  --yellow:#fcdd71;
  --blue:#9fd5f7;
  --nav-muted:#62615d;
  --col:205.33px;
  --gap:13px;
  --pitch:282.5px;
  --r:22px;
  --display:"Archivo","Arial Black",Impact,system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --img-sculpt:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc524fc3-03c3-40a1-9954-22eab1322592.webp);
  --img-man:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/1d56967e-0ed5-40f8-812d-9360e5ec1780.webp);
  --img-visit:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5f3f6135-26b9-4c48-92ad-105161327cbc.webp);
  --img-sil:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e7b68ae9-9240-4f52-a0a2-89082df4b8d0.webp);
  --grain:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/40b7fef3-410d-4ef3-bd67-0a2fc7ee5a1d.svg);
}
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
  overflow:hidden;
}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit}
:focus-visible{outline:2px solid #3b82f6;outline-offset:3px}
button{font:inherit;cursor:pointer}

/* ============ STAGE ============ */
.stage{position:relative;height:100svh;overflow:hidden}

/* ============ X MASCOT (the site mascot, ink on paper) ============ */
.xmascot{position:relative;display:inline-block;width:46px;height:42px;flex:none}
.xb{position:absolute;top:0;left:50%;width:10px;height:100%;background:var(--ink);border-radius:6px}
.xb.b1{transform:translateX(-50%) rotate(40deg)}
.xb.b2{transform:translateX(-50%) rotate(-40deg)}

/* ============ TOP-RIGHT subtle controls ============ */
.topbtns{position:fixed;top:18px;right:18px;z-index:60;display:flex;gap:10px}
.tbtn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
  border:1px solid rgba(15,15,14,.12);
  display:flex;align-items:center;justify-content:center;
  opacity:.45;transition:opacity .25s,transform .25s;
}
.tbtn:hover,.tbtn:focus-visible,.tbtn.on{opacity:1;transform:translateY(-1px)}
.tbtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pop{
  position:fixed;top:70px;right:18px;z-index:60;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border:1px solid rgba(15,15,14,.12);border-radius:16px;
  padding:12px 14px;box-shadow:0 18px 44px -20px rgba(15,15,14,.35);
  display:none;align-items:center;gap:10px;
}
.pop.show{display:flex}
.pop input{
  border:1px solid rgba(15,15,14,.16);border-radius:10px;
  padding:9px 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink);
  min-width:0;
}
#searchPop input{width:210px}
#searchCount{font-size:12px;font-weight:600;color:var(--nav-muted);white-space:nowrap}
#searchClear{
  width:28px;height:28px;border-radius:50%;border:1px solid rgba(15,15,14,.16);
  background:#fff;font-size:15px;line-height:1;color:var(--ink);
}

/* ============ HERO ============ */
.hero{
  position:relative;height:100svh;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  align-items:center;gap:24px;
  padding:48px;max-width:1440px;margin:0 auto;
}
.hero-copy{position:relative;z-index:2;max-width:520px}
.hero-copy .xmascot{margin-bottom:26px}
.eyebrow{
  display:block;font-size:11px;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;color:var(--nav-muted);
  margin-bottom:22px;
}
h1{
  font-family:var(--display);font-weight:900;text-transform:uppercase;
  font-size:clamp(52px,7.2vw,96px);line-height:.94;letter-spacing:-.055em;
  -webkit-text-stroke:1px var(--ink);
}
h1 .ln{display:block;overflow:hidden}
h1 .ln>span{display:inline-block;will-change:transform}
.hero-copy p{
  margin-top:28px;font-size:17px;line-height:1.65;color:#3a3936;max-width:44ch;
}
.acts{margin-top:34px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.btn-pill{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--ink);color:#fff;text-decoration:none;border:0;
  font-weight:600;font-size:15px;
  padding:18px 30px;border-radius:999px;
  transition:transform .25s cubic-bezier(.2,.7,.3,1.2);
}
.btn-pill:hover{transform:translateY(-2px)}
.link-bold{
  font-weight:700;font-size:15px;text-decoration:none;background:none;border:0;
  border-bottom:2px solid var(--ink);padding-bottom:3px;color:var(--ink);
}

/* ============ MOSAIC GRID (the journal itself) ============ */
.grid-wrap{
  position:relative;height:min(86svh,760px);
  overflow:hidden;touch-action:none;cursor:grab;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);
}
.grid-wrap.dragging{cursor:grabbing}
.grid{
  position:absolute;top:0;bottom:0;right:0;
  width:calc(3*var(--col) + 2*var(--gap));
  display:flex;gap:var(--gap);
}
.col{position:relative;width:var(--col);flex:none;will-change:transform}
.cell{
  position:relative;border-radius:var(--r);overflow:hidden;flex:none;
  margin-bottom:var(--gap);
}
/* photo + solid filler cells */
.ph{--pic:var(--img-sculpt);background:#d8d5cf;height:var(--pitch)}
.ph.i-man{--pic:var(--img-man)}
.ph.i-visit{--pic:var(--img-visit)}
.ph.i-sil{--pic:var(--img-sil)}
.ph::before{
  content:"";position:absolute;background-image:var(--pic);
  background-repeat:no-repeat;background-size:cover;background-position:center;
  width:100%;height:100%;left:0;top:0;
}
.f-sculpt::before{width:124.19%;height:112.57%;left:-16.07%;top:-8.5%;background-size:100% 100%}
.f-man::before{width:113.48%;height:103.36%;left:-5.36%;top:-3.54%;background-size:100% 100%}
.f-visit::before{width:110.07%;height:100%;left:-3.9%;top:8.5%;background-size:100% 100%}
.f-visit{background:linear-gradient(90deg,#c6c5c3,#9b9a98 55%,#7a7977)}
.f-visit::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.26),rgba(0,0,0,0) 13%);
}
.f-sil::before{width:139.29%;height:126.37%;left:-8.77%;top:-56.64%;background-size:100% 100%}
.red{background:var(--red);height:var(--pitch)}
.yellow{background:var(--yellow);height:var(--pitch)}
.blue{background:var(--blue);height:var(--pitch)}
.cream{background:var(--card-cream);box-shadow:inset 0 0 0 1px #e9e6df;height:var(--pitch)}
.dark{background:var(--card-dark);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);height:var(--pitch)}
.spacer{background:transparent;height:calc(var(--pitch)*.55)}
.red::after,.yellow::after,.blue::after,.cream::after{
  content:"";position:absolute;inset:0;
  background-image:var(--grain);opacity:.13;mix-blend-mode:multiply;pointer-events:none;
}
.dark::after{
  content:"";position:absolute;inset:0;
  background-image:var(--grain);opacity:.035;mix-blend-mode:screen;pointer-events:none;
}
/* ---- entry blocks: heading + date only, tap to expand ---- */
.entry{
  background:var(--card-cream);
  border:1px solid rgba(15,15,14,.10);
  padding:24px 22px 20px;cursor:pointer;
  box-shadow:0 18px 40px -28px rgba(15,15,14,.35);
  transition:opacity .3s;
  min-height:200px;
}
.entry .e-photo{
  height:150px;border-radius:14px;margin:-8px -6px 16px;
  background-size:cover;background-position:center;background-color:#d8d5cf;
}
.entry .e-date{
  font-family:var(--display);font-weight:700;font-size:12px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--red);
}
.entry h3{
  font-family:var(--display);font-weight:800;
  font-size:21px;letter-spacing:-.015em;line-height:1.2;
  margin:9px 0 0;color:var(--ink);
}
.entry .e-full{
  display:none;color:#2b2a27;line-height:1.8;font-size:14.5px;
  white-space:pre-line;margin-top:14px;
}
.entry .e-hint{
  display:inline-block;margin-top:16px;font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--nav-muted);
}
.entry.open .e-full{display:block}
.entry.open .e-hint{color:var(--red)}
.entry.dim{opacity:.12;pointer-events:none}
.entry.hit{box-shadow:0 0 0 2px var(--red),0 18px 40px -28px rgba(15,15,14,.35)}

/* ============ INTRO ============ */
html.intro .hero-copy>*{opacity:0}
html.intro h1 .ln>span{transform:translateY(110%)}
html.intro .grid{opacity:0}
html.intro .topbtns{opacity:0}

/* ============ RESPONSIVE ============ */
@media(max-width:899px){
  .hero{grid-template-columns:1fr;padding:84px 22px 16px;align-content:start;gap:8px}
  .hero-copy .xmascot{width:38px;height:35px;margin-bottom:16px}
  .hero-copy .xmascot .xb{width:8px}
  h1{font-size:clamp(40px,12.5vw,64px)}
  .hero-copy p{font-size:15px;margin-top:18px}
  .acts{margin-top:22px}
  .btn-pill{padding:14px 24px;font-size:14px}
  .grid-wrap{height:52svh;--col:150px;--pitch:210px;--r:16px;--gap:10px}
  .grid{width:calc(3*var(--col) + 2*var(--gap))}
  .f-visit::before,.f-sil::before{background-size:cover;width:100%;height:100%;left:0;top:0}
  .f-visit::after{display:none}
  .entry{min-height:170px;padding:20px 18px 16px}
  .entry h3{font-size:18px}
}
@media(min-width:560px) and (min-aspect-ratio:1/1) and (max-width:899px){
  .hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center}
  .grid-wrap{height:76svh}
}
@media(max-width:600px){
  .red::after,.yellow::after,.blue::after,.cream::after,.dark::after{display:none}
}
@media(prefers-reduced-motion:reduce){
  html.intro .hero-copy>*{opacity:1}
  html.intro h1 .ln>span{transform:none}
  html.intro .grid{opacity:1}
  html.intro .topbtns{opacity:1}
}
</style>
</head>
<body>
<div class="stage">

  <div class="topbtns">
    <button class="tbtn" id="searchBtn" aria-label="Search entries" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    </button>
    <button class="tbtn" id="dateBtn" aria-label="Jump to date" aria-expanded="false">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="2.8" x2="8" y2="7"/><line x1="16" y1="2.8" x2="16" y2="7"/></svg>
    </button>
  </div>
  <div class="pop" id="searchPop">
    <input id="searchInput" type="search" placeholder="Search entries…" aria-label="Search entries">
    <span id="searchCount"></span>
    <button id="searchClear" aria-label="Clear search">×</button>
  </div>
  <div class="pop" id="datePop">
    <input type="date" id="dateInput" aria-label="Jump to date">
  </div>

  <section class="hero">
    <div class="hero-copy">
      <span class="xmascot" role="img" aria-label="Aditya X mascot"><span class="xb b1"></span><span class="xb b2"></span></span>
      <span class="eyebrow">A private journal</span>
      <h1 aria-label="An archive of days cast in memory">
        <span class="ln"><span>An archive</span></span>
        <span class="ln"><span>of days</span></span>
        <span class="ln"><span>cast in</span></span>
        <span class="ln"><span>memory</span></span>
      </h1>
      <p>Days from the climb — MBBS, and everything after — kept one card at a time, newest on top. This page isn&rsquo;t listed anywhere; it&rsquo;s a quiet corner of the site.</p>
      <div class="acts">
        <button class="btn-pill" id="readFirst">Read the first entry</button>
        <button class="link-bold" id="goLatest">Latest</button>
      </div>
    </div>
    <div class="grid-wrap" id="gridWrap">
      <div class="grid" id="grid">
        <div class="col" data-col="0"></div>
        <div class="col" data-col="1"></div>
        <div class="col" data-col="2"></div>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
"use strict";
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var html = document.documentElement;

/* ---------- data ---------- */
var entries = []; // newest-first
var FILLERS = [
  ["red","ph i-sculpt f-sculpt","blue","cream","ph i-man f-man","spacer","yellow"],
  ["yellow","ph i-visit f-visit","dark","ph i-sil f-sil","red","spacer","blue"],
  ["blue","cream","ph i-sil","yellow","ph i-sculpt","spacer","dark"]
];
var PHOTO_CLASS = {
  "sculpt":"ph i-sculpt f-sculpt","man":"ph i-man f-man",
  "visit":"ph i-visit f-visit","sil":"ph i-sil f-sil"
};

function escapeHtml(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function formatDate(iso){
  var d=new Date(iso+"T00:00:00");
  return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
}
function fillerCell(kind){
  if(kind.indexOf("ph ")===0) return '<div class="cell '+kind+'"></div>';
  return '<div class="cell '+kind+'"></div>';
}
function entryCell(e, idx){
  var photo = (e.photos && e.photos.length)
    ? '<div class="e-photo" style="background-image:url('+escapeHtml(e.photos[0])+')"></div>' : "";
  return '<article class="cell entry" data-idx="'+idx+'" data-date="'+escapeHtml(e.date)+'" tabindex="0" role="button" aria-expanded="false" aria-label="'+escapeHtml(e.title)+", "+escapeHtml(formatDate(e.date))+'">'+
    photo +
    '<div class="e-date">'+escapeHtml(formatDate(e.date))+'</div>'+
    "<h3>"+escapeHtml(e.title)+"</h3>"+
    '<div class="e-full">'+escapeHtml(e.body)+"</div>"+
    '<span class="e-hint">Tap to read</span>'+
  "</article>";
}

/* ---------- build columns ---------- */
var cols = Array.prototype.slice.call(document.querySelectorAll(".col"));
var pos = [0,0,0], cycles = [0,0,0], dirs = [-1,1,-1];
var autoCol = [true,true,true], expandPause = [false,false,false];
var userHold = false, idleTimer = null;
var LOOP_SECS = 14.6, RESUME_MS = 3500;

function buildColumns(){
  // clear
  cols.forEach(function(c){ c.innerHTML=""; });
  expandPause = [false,false,false];
  // round-robin entries across columns, newest first
  var perCol = [[],[],[]];
  entries.forEach(function(e,i){ perCol[i%3].push({e:e,idx:i}); });
  perCol.forEach(function(list,ci){
    var htmlCells = [];
    list.forEach(function(item){ htmlCells.push(entryCell(item.e,item.idx)); });
    // interleave fillers so columns look full
    var fi = 0, guard = 0;
    while(htmlCells.length < 7 && guard < 40){
      var kind = FILLERS[ci][fi % FILLERS[ci].length];
      // avoid two spacers/photos clumping: insert filler after each entry block too
      htmlCells.push(fillerCell(kind));
      fi++; guard++;
    }
    // weave: entry, filler, entry, filler...
    var woven = [], ei = 0;
    var onlyFillers = htmlCells.filter(function(h){ return h.indexOf("cell entry")<0; });
    var onlyEntries = htmlCells.filter(function(h){ return h.indexOf("cell entry")>=0; });
    var f2 = 0;
    onlyEntries.forEach(function(en){
      woven.push(en);
      if(f2 < onlyFillers.length){ woven.push(onlyFillers[f2++]); }
    });
    while(f2 < onlyFillers.length){ woven.push(onlyFillers[f2++]); }
    cols[ci].innerHTML = woven.join("");
    // duplicate once for seamless loop
    cols[ci].innerHTML += cols[ci].innerHTML;
  });
  // measure cycles + stagger
  requestAnimationFrame(function(){
    cols.forEach(function(c,i){
      cycles[i] = c.scrollHeight/2 || 1;
    });
    pos = [0, -cycles[1]*0.35, -cycles[2]*0.55];
  });
  bindEntryTaps();
}

/* ---------- tap vs drag + expand ---------- */
var gridWrap = document.getElementById("gridWrap");
var pStart = null;

gridWrap.addEventListener("pointerdown", function(ev){
  pStart = { y: ev.clientY, t: Date.now(), pos: pos.slice(), moved: false };
  userHold = true;
  clearTimeout(idleTimer);
  gridWrap.classList.add("dragging");
  gridWrap.setPointerCapture && gridWrap.setPointerCapture(ev.pointerId);
});
gridWrap.addEventListener("pointermove", function(ev){
  if(!pStart) return;
  var dy = ev.clientY - pStart.y;
  if(Math.abs(dy) > 10) pStart.moved = true;
  if(pStart.moved){
    for(var i=0;i<3;i++){
      var raw = pStart.pos[i] + dy, cyc = cycles[i] || 1;
      pos[i] = -((((raw % cyc) + cyc) % cyc) || 0);
      if(pos[i] <= -cyc) pos[i] = 0;
    }
  }
});
function endPointer(ev){
  if(!pStart) return;
  var wasTap = !pStart.moved && (Date.now()-pStart.t) < 500;
  var target = ev.target && ev.target.closest ? ev.target.closest(".entry") : null;
  pStart = null;
  gridWrap.classList.remove("dragging");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){ userHold = false; }, RESUME_MS);
  if(wasTap && target) toggleEntry(target);
}
gridWrap.addEventListener("pointerup", endPointer);
gridWrap.addEventListener("pointercancel", function(){ pStart=null; gridWrap.classList.remove("dragging"); idleTimer=setTimeout(function(){userHold=false;},RESUME_MS); });

function toggleEntry(card){
  var colEl = card.closest(".col");
  var ci = cols.indexOf(colEl);
  var idx = card.getAttribute("data-idx");
  var willOpen = !card.classList.contains("open");
  // toggle the card AND its loop-duplicate clone so halves stay identical
  colEl.querySelectorAll('.entry[data-idx="'+idx+'"]').forEach(function(c){
    c.classList.toggle("open", willOpen);
    c.setAttribute("aria-expanded", willOpen ? "true" : "false");
    c.querySelector(".e-hint").textContent = willOpen ? "Tap to collapse" : "Tap to read";
  });
  expandPause[ci] = willOpen;
  // recompute cycle after layout settles
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ cycles[ci] = colEl.scrollHeight/2 || 1; });
  });
}
function bindEntryTaps(){
  // keyboard access
  cols.forEach(function(c){
    c.querySelectorAll(".entry").forEach(function(card){
      card.addEventListener("keydown", function(ev){
        if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); toggleEntry(card); }
      });
    });
  });
}

/* ---------- rAF marquee ---------- */
var lastT = 0;
function tick(t){
  var dt = lastT ? Math.min(0.05,(t-lastT)/1000) : 0;
  lastT = t;
  if(!reduced && dt > 0){
    for(var i=0;i<3;i++){
      if(autoCol[i] && !expandPause[i] && !userHold && cycles[i]>0){
        pos[i] += dirs[i]*(cycles[i]/LOOP_SECS)*dt;
        if(pos[i] <= -cycles[i]) pos[i] += cycles[i];
        if(pos[i] > 0) pos[i] -= cycles[i];
      }
      cols[i].style.transform = "translate3d(0,"+pos[i]+"px,0)";
    }
  } else {
    for(var j=0;j<3;j++){ cols[j].style.transform = "translate3d(0,"+pos[j]+"px,0)"; }
  }
  requestAnimationFrame(tick);
}

/* ---------- date jump ---------- */
var dateBtn=document.getElementById("dateBtn"), datePop=document.getElementById("datePop"),
    dateInput=document.getElementById("dateInput");
function closePops(){ document.querySelectorAll(".pop").forEach(function(p){p.classList.remove("show");}); dateBtn.classList.remove("on"); searchBtn.classList.remove("on"); dateBtn.setAttribute("aria-expanded","false"); searchBtn.setAttribute("aria-expanded","false"); }
dateBtn.addEventListener("click", function(){
  var willShow = !datePop.classList.contains("show");
  closePops();
  if(willShow){ datePop.classList.add("show"); dateBtn.classList.add("on"); dateBtn.setAttribute("aria-expanded","true"); dateInput.focus(); }
});
dateInput.addEventListener("change", function(){
  if(!dateInput.value || !entries.length) return;
  var t = new Date(dateInput.value+"T00:00:00").getTime(), best=0, bestD=Infinity;
  entries.forEach(function(e,i){
    var d=Math.abs(new Date(e.date+"T00:00:00").getTime()-t);
    if(d<bestD){bestD=d;best=i;}
  });
  entries = entries.slice(best).concat(entries.slice(0,best)); // rotate: nearest first
  buildColumns();
  closePops();
});

/* ---------- search ---------- */
var searchBtn=document.getElementById("searchBtn"), searchPop=document.getElementById("searchPop"),
    searchInput=document.getElementById("searchInput"), searchCount=document.getElementById("searchCount"),
    searchClear=document.getElementById("searchClear");
searchBtn.addEventListener("click", function(){
  var willShow = !searchPop.classList.contains("show");
  closePops();
  if(willShow){ searchPop.classList.add("show"); searchBtn.classList.add("on"); searchBtn.setAttribute("aria-expanded","true"); searchInput.focus(); }
});
function clearSearch(){
  searchInput.value=""; searchCount.textContent="";
  document.querySelectorAll(".entry").forEach(function(c){ c.classList.remove("dim","hit"); });
}
searchClear.addEventListener("click", function(){ clearSearch(); searchInput.focus(); });
searchInput.addEventListener("input", function(){
  var q = searchInput.value.trim().toLowerCase();
  var cards = document.querySelectorAll(".entry"), n=0;
  cards.forEach(function(card){
    var idx = +card.getAttribute("data-idx");
    var e = entries[idx];
    var hay = ((e.title||"")+" "+(e.body||"")).toLowerCase();
    var match = q && hay.indexOf(q) >= 0;
    card.classList.toggle("dim", !!q && !match);
    card.classList.toggle("hit", !!q && match);
  });
  // count unique matched entries
  var seen={};
  cards.forEach(function(card){
    if(card.classList.contains("hit")) seen[card.getAttribute("data-idx")]=1;
  });
  n = Object.keys(seen).length;
  searchCount.textContent = q ? (n+" found") : "";
});
document.addEventListener("keydown", function(ev){
  if(ev.key==="Escape"){ closePops(); clearSearch(); }
});
document.addEventListener("pointerdown", function(ev){
  if(!ev.target.closest(".pop") && !ev.target.closest(".tbtn")) closePops();
});

/* ---------- hero CTAs ---------- */
document.getElementById("readFirst").addEventListener("click", function(){
  var first = document.querySelector('.col[data-col="0"] .entry');
  if(first && !first.classList.contains("open")) toggleEntry(first);
});
document.getElementById("goLatest").addEventListener("click", function(){
  // re-sort newest-first and rebuild
  entries.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  buildColumns();
});

/* ---------- entrance ---------- */
function runEntrance(){
  if(reduced){ html.classList.remove("intro"); return; }
  setTimeout(function(){ html.classList.remove("intro"); }, 4000);
  var items = document.querySelectorAll(".hero-copy > *");
  items.forEach(function(el,i){
    el.animate(
      [{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"translateY(0)"}],
      {duration:800,delay:200+i*90,easing:"cubic-bezier(0.16,1,0.3,1)",fill:"forwards"}
    );
  });
  document.querySelectorAll("h1 .ln > span").forEach(function(sp,i){
    sp.animate(
      [{transform:"translateY(110%)"},{transform:"translateY(0)"}],
      {duration:1000,delay:280+i*85,easing:"cubic-bezier(0.16,1,0.3,1)",fill:"forwards"}
    );
  });
  document.getElementById("grid").animate(
    [{opacity:0},{opacity:1}],
    {duration:1200,delay:450,easing:"cubic-bezier(0.25,1,0.5,1)",fill:"forwards"}
  );
  document.querySelector(".topbtns").animate(
    [{opacity:0},{opacity:1}],
    {duration:800,delay:700,fill:"forwards"}
  );
  setTimeout(function(){ html.classList.remove("intro"); }, 2100);
}

/* ---------- init ---------- */
if(!reduced) html.classList.add("intro");
fetch("journal-posts.json",{cache:"no-store"})
  .then(function(r){ return r.json(); })
  .then(function(posts){
    entries = posts.slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    buildColumns();
  })
  .catch(function(){ buildColumns(); });
requestAnimationFrame(tick);
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",runEntrance); }
else{ runEntrance(); }
})();
</script>
</body>
</html>
