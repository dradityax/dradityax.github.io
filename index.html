<script>
(function(){
"use strict";
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var $ = function(id){ return document.getElementById(id); };
var bg=$("bg"), shade=$("shade"),
    tagline=$("tagline"), bio=$("bio"),
    plinks=$("plinks"), panel=$("panel");



/* bio karaoke */
var WORDS=["Mortui","vivos","docent."];
var wordSpans=WORDS.map(function(w){
  var s=document.createElement("span");
  s.className="w"; s.textContent=w;
  bio.appendChild(s); return s;
});
var wi=-1;
function karaoke(){
  for(var i=0;i<wordSpans.length;i++) wordSpans[i].classList.remove("on");
  wi++;
  if(wi>=wordSpans.length){ wi=-1; setTimeout(karaoke, reduce?0:1700); return; }
  wordSpans[wi].classList.add("on");
  setTimeout(karaoke, reduce?0:780);
}

/* reveal : video fades in directly, rest follows */
var btns=Array.prototype.slice.call(panel.querySelectorAll(".hbtn"));
function revealAll(){
  bg.classList.add("show"); shade.classList.add("show");
  setTimeout(function(){
    tagline.classList.add("show");
    bio.classList.add("show");
    plinks.classList.add("show");
    panel.classList.add("show");
    setTimeout(karaoke, 500);
    btns.forEach(function(b,i){
      setTimeout(function(){ b.classList.add("pop"); }, i*160);
    });
  }, reduce?0:400);
}

/* placeholder links : do nothing for now */
Array.prototype.slice.call(plinks.querySelectorAll(".plink")).forEach(function(a){
  a.addEventListener("click",function(e){ e.preventDefault(); });
});

/* apple app-open on icon tap */
function appOpen(b){
  var url=b.getAttribute("href"), label=b.getAttribute("aria-label")||"";
  var w=null;
  try{ w=window.open(url,"_blank","noopener"); }catch(e){}
  var r=b.getBoundingClientRect();
  try{
    b.animate([{transform:"scale(1)"},{transform:"scale(1.3)"},{transform:"scale(1)"}],
      {duration:380,easing:"cubic-bezier(.2,1.6,.4,1)"});
  }catch(e){}
  var ov=document.createElement("div");
  ov.className="appopen";
  var svg=b.querySelector("svg");
  ov.innerHTML='<div class="ao-logo">'+(svg?svg.outerHTML:"")+'</div><div class="ao-label">'+label+"</div>";
  ov.style.left=r.left+"px"; ov.style.top=r.top+"px";
  ov.style.width=r.width+"px"; ov.style.height=r.height+"px";
  document.body.appendChild(ov);
  void ov.offsetWidth;
  requestAnimationFrame(function(){ ov.classList.add("go"); });
  setTimeout(function(){ ov.classList.add("fade"); },750);
  setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },1250);
  if(!w){ window.location.href=url; }
}
btns.forEach(function(b){
  b.addEventListener("click",function(e){
    if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
    e.preventDefault(); e.stopPropagation();
    appOpen(b);
  },true);
});

setTimeout(revealAll, reduce?0:600);
})();
</script>
