<script>
(function(){
"use strict";
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var $ = function(id){ return document.getElementById(id); };
var bg=$("bg"), shade=$("shade"),
    tagline=$("tagline"), bio=$("bio"),
    plinks=$("plinks"), fabwrap=$("fabwrap"), fab=$("fab"), scrim=$("scrim");



/* bio karaoke */
var WORDS=["Mortui","vivos","docent."];
var wordSpans=WORDS.map(function(w){
  var s=document.createElement("span");
  s.className="w"; s.textContent=w;
  bio.appendChild(s); return s;
});
var wi=-1;
function karaoke(){
  for(var i=0;i<wordSpans.length;i++) wordSpans[i].classList.remove("on");
  wi++;
  if(wi>=wordSpans.length){ wi=-1; setTimeout(karaoke, reduce?0:1700); return; }
  wordSpans[wi].classList.add("on");
  setTimeout(karaoke, reduce?0:780);
}

/* reveal : video fades in directly, rest follows */
function revealAll(){
  bg.classList.add("show"); shade.classList.add("show");
  bio.classList.add("show");
  setTimeout(function(){
    tagline.classList.add("show");
    plinks.classList.add("show");
    fabwrap.classList.add("show");
    setTimeout(karaoke, 500);
  }, reduce?0:400);
}

/* placeholder links : do nothing for now */
/* social FAB : toggle */
function setFab(open){
  fabwrap.classList.toggle("open",open);
  fabwrap.classList.remove("hint");
  fab.setAttribute("aria-expanded",open?"true":"false");
}
fab.addEventListener("click",function(e){
  e.stopPropagation();
  setFab(!fabwrap.classList.contains("open"));
});
scrim.addEventListener("click",function(){ setFab(false); });
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") setFab(false);
});

Array.prototype.slice.call(plinks.querySelectorAll(".plink")).forEach(function(a){
  a.addEventListener("click",function(e){
    var h=a.getAttribute("href");
    if(!h||h==="#"){ e.preventDefault(); }
  });
});


/* cute X : dots -> lines -> X, slow and natural */
function dxSet(el, tf, ms, ease){
  el.style.transition = "transform "+ms+"ms "+(ease||"ease-in-out");
  el.style.transform = tf;
  return new Promise(function(r){ setTimeout(r, reduce?0:ms); });
}
var dx1=$("dx1"), dx2=$("dx2");
var dxg=$("dxg"), dxb=$("dxb");
var DX_DOT1="translateX(-.20em) scaleY(.236)", DX_DOT2="translateX(.20em) scaleY(.236)";
var DX_BLINK1="translateX(-.20em) scaleY(.02)", DX_BLINK2="translateX(.20em) scaleY(.02)";
var DX_LINE1="translateX(-.20em) scaleY(1)", DX_LINE2="translateX(.20em) scaleY(1)";
var DX_X1="translateX(-50%) rotate(40deg) scaleY(1)", DX_X2="translateX(-50%) rotate(-40deg) scaleY(1)";
function dxBlink(){
  return Promise.all([
    dxSet(dx1, DX_BLINK1, 150, "ease-in"), dxSet(dx2, DX_BLINK2, 150, "ease-in")
  ]).then(function(){
    return Promise.all([
      dxSet(dx1, DX_DOT1, 200, "ease-out"), dxSet(dx2, DX_DOT2, 200, "ease-out")
    ]);
  });
}
function dxGlasses(){
  dxg.classList.add("show");
  return new Promise(function(r){ setTimeout(r, 700); })
    .then(dxBlink)
    .then(function(){ return new Promise(function(r){ setTimeout(r, 2200); }); })
    .then(function(){ dxg.classList.remove("show"); return new Promise(function(r){ setTimeout(r, 450); }); });
}
async function dxRead(){
  dxb.classList.add("open");
  await new Promise(function(r){ setTimeout(r, 550); });
  for(var i=0;i<3;i++){
    await Promise.all([
      dxSet(dx1, "translateX(-.14em) scaleY(.236)", 380),
      dxSet(dx2, "translateX(.26em) scaleY(.236)", 380)
    ]);
    await Promise.all([
      dxSet(dx1, "translateX(-.26em) scaleY(.236)", 380),
      dxSet(dx2, "translateX(.14em) scaleY(.236)", 380)
    ]);
  }
  await Promise.all([ dxSet(dx1, DX_DOT1, 320), dxSet(dx2, DX_DOT2, 320) ]);
  await new Promise(function(r){ setTimeout(r, 350); });
  dxb.classList.remove("open");
  await new Promise(function(r){ setTimeout(r, 500); });
}
var dxN=0;
async function dxLoop(){
  while(true){
    dxN++;
    await new Promise(function(r){ setTimeout(r, 2800); });
    for(var i=0;i<2;i++){ await dxBlink(); await new Promise(function(r){ setTimeout(r, i<1?1200:2200); }); }
    if(dxN%4===2){ await dxGlasses(); }
    else if(dxN%4===0){ await dxRead(); }
    await new Promise(function(r){ setTimeout(r, 1500); });
    await Promise.all([ dxSet(dx1, DX_LINE1, 1100), dxSet(dx2, DX_LINE2, 1100) ]);
    await new Promise(function(r){ setTimeout(r, 900); });
    await Promise.all([
      dxSet(dx1, DX_X1, 1500, "cubic-bezier(.3,1.2,.4,1)"),
      dxSet(dx2, DX_X2, 1500, "cubic-bezier(.3,1.2,.4,1)")
    ]);
    await new Promise(function(r){ setTimeout(r, 8000); });
    await Promise.all([ dxSet(dx1, DX_LINE1, 1300), dxSet(dx2, DX_LINE2, 1300) ]);
    await new Promise(function(r){ setTimeout(r, 700); });
    await Promise.all([ dxSet(dx1, DX_DOT1, 1100), dxSet(dx2, DX_DOT2, 1100) ]);
  }
}
setTimeout(function(){ if(!reduce) dxLoop(); }, 1500);

revealAll();
})();
</script>
<script>
/* Starfall — ambient + play mode, 3 lives */
(function(){
"use strict";
var cv=document.getElementById("bg");
if(!cv||!cv.getContext)return;
var ctx=cv.getContext("2d");
var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var W=0,H=0,DPR=1,stars=[],mets=[],parts=[];
var ship={x:0,y:0,tx:0,ty:0,inv:0,flash:0,alive:true,resp:0,bob:0};
var keys={},dist=0,stage=1,t0=0,last=0,spawnT=0,hudT=0,running=true;
var mode="ambient",lives=3,best=0;
try{best=parseInt(localStorage.getItem("starfall_best")||"0",10)||0;}catch(e){best=0;}
var hud=document.createElement("div");hud.id="hud";hud.setAttribute("aria-hidden","true");document.body.appendChild(hud);
var playbtn=document.getElementById("playbtn"),exitbtn=document.getElementById("exitbtn"),
    heartsEl=document.getElementById("hearts"),over=document.getElementById("gameover"),
    overDist=document.getElementById("overdist"),overBest=document.getElementById("overbest"),
    againBtn=document.getElementById("again");
var heartSvgs=heartsEl?heartsEl.querySelectorAll("svg"):[];
function rnd(a,b){return a+Math.random()*(b-a);}
function initStars(){
  stars.length=0;
  var n=Math.max(60,Math.min(200,Math.round(W*H/11000)));
  for(var i=0;i<n;i++)stars.push({x:rnd(0,W),y:rnd(0,H),z:rnd(.15,1)});
}
function parkShip(){ship.x=W/2;ship.y=H*0.68;ship.tx=ship.x;ship.ty=ship.y;}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.75);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initStars();
  if(mode==="ambient")parkShip();
}
window.addEventListener("resize",resize);
function spawnMet(){
  var r=rnd(9,26),v=[],n=8;
  for(var i=0;i<n;i++){var a=i/n*Math.PI*2,rr=rnd(.72,1.08);v.push([Math.cos(a)*rr,Math.sin(a)*rr]);}
  mets.push({x:rnd(-20,W+20),y:-40,vx:rnd(-30,30),vy:(70+stage*42)*rnd(.7,1.25),r:r,rot:rnd(0,6.28),vr:rnd(-1.5,1.5),v:v});
}
function burst(x,y,big){
  var n=big?26:14;
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rnd(-190,190),vy:rnd(-190,190),l:rnd(.35,big?.9:.7),t:0});
}
function updateHearts(){
  for(var i=0;i<heartSvgs.length;i++)heartSvgs[i].classList.toggle("lost",i>=lives);
}
function drawShip(){
  if(!ship.alive)return;
  var s=ship;
  ctx.save();ctx.translate(s.x,s.y+(mode==="ambient"?Math.sin(s.bob)*4:0));
  if(s.flash>0)ctx.globalAlpha=Math.max(.25,1-s.flash*2);
  else if(s.inv>0&&Math.floor(s.inv*10)%2===0)ctx.globalAlpha=.3;
  var fl=5+Math.random()*7+stage;
  ctx.fillStyle="rgba(150,190,255,.5)";
  ctx.beginPath();ctx.moveTo(-3.5,7);ctx.lineTo(0,7+fl);ctx.lineTo(3.5,7);ctx.closePath();ctx.fill();
  ctx.fillStyle="#ffffff";
  ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(6.5,8);ctx.lineTo(0,3.5);ctx.lineTo(-6.5,8);ctx.closePath();ctx.fill();
  ctx.restore();
}
function die(){
  burst(ship.x,ship.y,true);
  ship.alive=false;ship.flash=0;
  if(mode==="playing"){
    lives--;updateHearts();
    if(lives<=0){gameOver();return;}
    ship.inv=2;ship.resp=0.9;
  }else{
    ship.resp=1.6;
  }
  for(var j=mets.length-1;j>=0;j--){var o=mets[j],ox=o.x-ship.x,oy=o.y-ship.y;if(ox*ox+oy*oy<16900)mets.splice(j,1);}
}
function gameOver(){
  mode="over";
  var d=Math.floor(dist);
  if(d>best){best=d;try{localStorage.setItem("starfall_best",String(best));}catch(e){}}
  overDist.textContent=d.toLocaleString("en-US")+" m";
  overBest.textContent="BEST "+best.toLocaleString("en-US")+" m";
  setTimeout(function(){if(mode==="over")over.classList.add("show");},600);
}
function startPlay(){
  mode="playing";lives=3;updateHearts();
  document.body.classList.add("playing");
  over.classList.remove("show");
  dist=0;t0=0;last=0;spawnT=1;mets.length=0;parts.length=0;
  ship.alive=true;ship.inv=1.5;parkShip();
}
function exitPlay(){
  mode="ambient";
  document.body.classList.remove("playing");
  over.classList.remove("show");
  dist=0;t0=0;last=0;mets.length=0;parts.length=0;
  lives=3;ship.alive=true;ship.inv=0;parkShip();
}
if(playbtn)playbtn.addEventListener("click",function(e){e.stopPropagation();startPlay();});
if(exitbtn)exitbtn.addEventListener("click",function(e){e.stopPropagation();exitPlay();});
if(againBtn)againBtn.addEventListener("click",function(e){e.stopPropagation();startPlay();});
function frame(now){
  if(!running){requestAnimationFrame(frame);return;}
  if(!last)last=now;
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(!t0)t0=now;
  var el=(now-t0)/1000;
  stage=Math.min(8,1+Math.floor(el/18));
  if(ship.alive&&mode!=="over")dist+=dt*(46+stage*24);
  ship.bob+=dt*2;
  if(!ship.alive){
    ship.resp-=dt;
    if(ship.resp<=0){ship.alive=true;ship.inv=2;if(mode==="ambient")parkShip();}
  }else if(mode==="playing"){
    var kx=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
    var ky=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);
    if(kx||ky){
      ship.x=Math.max(14,Math.min(W-14,ship.x+kx*430*dt));
      ship.y=Math.max(14,Math.min(H-14,ship.y+ky*430*dt));
      ship.tx=ship.x;ship.ty=ship.y;
    }else{
      var e=Math.min(1,dt*7);
      ship.x+=(ship.tx-ship.x)*e;ship.y+=(ship.ty-ship.y)*e;
    }
  }
  if(ship.inv>0)ship.inv-=dt;
  if(ship.flash>0)ship.flash-=dt;
  if(mode!=="over"){
    spawnT-=dt;
    var maxM=Math.min(44,10+stage*5);
    if(spawnT<=0&&mets.length<maxM&&el>1.2){spawnMet();spawnT=Math.max(.16,.85-stage*.08);}
  }
  var i,m,dx,dy;
  for(i=mets.length-1;i>=0;i--){
    m=mets[i];
    m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=m.vr*dt;
    if(m.y>H+60||m.x<-70||m.x>W+70){mets.splice(i,1);continue;}
    if(ship.alive&&ship.inv<=0){
      dx=m.x-ship.x;dy=m.y-ship.y;
      if(dx*dx+dy*dy<Math.pow(m.r*.78+8,2)){die();break;}
    }
  }
  for(var p=parts.length-1;p>=0;p--){
    var q=parts[p];q.t+=dt;
    if(q.t>q.l){parts.splice(p,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;
  }
  ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
  var spd=1+stage*.32,s,st;
  for(s=0;s<stars.length;s++){
    st=stars[s];
    st.y+=st.z*46*spd*dt;
    if(st.y>H+8){st.y=-8;st.x=rnd(0,W);}
    var len=st.z*stage*9*spd;
    ctx.strokeStyle="rgba(255,255,255,"+(0.25+st.z*0.5).toFixed(2)+")";
    ctx.lineWidth=st.z*1.6;
    ctx.beginPath();ctx.moveTo(st.x,st.y);ctx.lineTo(st.x,st.y-len);ctx.stroke();
  }
  for(var k=0;k<mets.length;k++){
    var mm=mets[k];
    ctx.save();ctx.translate(mm.x,mm.y);ctx.rotate(mm.rot);
    ctx.fillStyle="rgba(158,158,170,.9)";
    ctx.beginPath();
    for(var vi=0;vi<mm.v.length;vi++){var pv=mm.v[vi];if(vi)ctx.lineTo(pv[0]*mm.r,pv[1]*mm.r);else ctx.moveTo(pv[0]*mm.r,pv[1]*mm.r);}
    ctx.closePath();ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.28)";
    ctx.beginPath();ctx.arc(-mm.r*.28,-mm.r*.28,mm.r*.3,0,6.29);ctx.fill();
    ctx.restore();
  }
  for(var b=0;b<parts.length;b++){
    var bp=parts[b],al=1-bp.t/bp.l;
    ctx.fillStyle="rgba(255,255,255,"+(al*.9).toFixed(2)+")";
    ctx.fillRect(bp.x,bp.y,2.4,2.4);
  }
  drawShip();
  hudT-=dt;
  if(hudT<=0){hud.textContent=Math.floor(dist).toLocaleString("en-US")+" m";hudT=.25;}
  requestAnimationFrame(frame);
}
window.addEventListener("pointermove",function(e){
  if(mode!=="playing")return;
  ship.tx=e.clientX;ship.ty=e.clientY-(e.pointerType==="touch"?46:0);
},{passive:true});
window.addEventListener("pointerdown",function(e){
  if(mode!=="playing")return;
  ship.tx=e.clientX;ship.ty=e.clientY-(e.pointerType==="touch"?46:0);
},{passive:true});
window.addEventListener("keydown",function(e){
  if((e.code.indexOf("Arrow")===0||e.code==="Space")&&e.target===document.body)e.preventDefault();
  keys[e.code]=true;
});
window.addEventListener("keyup",function(e){keys[e.code]=false;});
document.addEventListener("visibilitychange",function(){running=!document.hidden;last=0;});
resize();
function paintStatic(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){var st0=stars[i];ctx.fillStyle="rgba(255,255,255,"+(0.25+st0.z*0.5).toFixed(2)+")";ctx.fillRect(st0.x,st0.y,st0.z*1.8,st0.z*1.8);}
  drawShip();
}
paintStatic();
updateHearts();
if(!reduced){
  var startGame=function(){ if(!t0)requestAnimationFrame(frame); };
  if(document.readyState==="complete")setTimeout(startGame,350);
  else window.addEventListener("load",function(){setTimeout(startGame,350);});
}
setTimeout(function(){hud.classList.add("show");},1200);
})();

</script>
</body>
</html>
