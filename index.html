<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aditya X</title>
<meta name="description" content="Aditya X — student of medicine. A little house on the internet. Come in, the door is open.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body { background:#f4f1ea; font-family:Inter, system-ui, -apple-system, sans-serif; -webkit-user-select:none; user-select:none; touch-action:none; }
  canvas.webgl { position:fixed; top:0; left:0; display:block; touch-action:none; }
  .brand { position:fixed; top:1.1rem; left:1.25rem; display:flex; align-items:center; gap:.5rem; text-decoration:none; z-index:10; opacity:0; transition:opacity 1s; }
  .monogram { width:2rem; height:2rem; border-radius:.6rem; background:linear-gradient(135deg,#ff6a3d,#c22e12); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.8rem; color:#fff; }
  .brand-name { color:#1a1a1a; font-weight:700; letter-spacing:-.02em; font-size:.95rem; }
  .tag { position:fixed; top:1.35rem; right:1.25rem; font-size:.7rem; color:rgba(0,0,0,.45); letter-spacing:.18em; text-transform:uppercase; z-index:10; opacity:0; transition:opacity 1s; }
  .hint { position:fixed; bottom:1.4rem; left:50%; transform:translateX(-50%); color:rgba(0,0,0,.5); font-size:.8rem; letter-spacing:.04em; z-index:10; pointer-events:none; text-align:center; padding:0 1rem; transition:opacity 1s; white-space:nowrap; opacity:0; }
  .title-card { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:10; pointer-events:none; transition:opacity 1.2s; opacity:0; }
  .title-card h1 { color:#1a1a1a; font-size:clamp(1.6rem,6vw,2.6rem); font-weight:800; letter-spacing:-.03em; }
  .title-card h1 span { color:#f13343; }
  .title-card p { color:rgba(0,0,0,.55); margin-top:.5rem; font-size:.9rem; }
  .joy { position:fixed; right:1.4rem; bottom:1.4rem; width:124px; height:124px; border-radius:50%; z-index:11; display:none;
    background:rgba(255,255,255,.5); border:1px solid rgba(0,0,0,.12);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); touch-action:none;
    box-shadow:0 6px 24px rgba(0,0,0,.08); opacity:0; transition:opacity 1s; }
  .joy .knob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, #e2e2e2);
    border:1px solid rgba(0,0,0,.1); box-shadow:0 4px 14px rgba(0,0,0,.18); }
  body.touch .joy { display:block; }
  body.touch .hint.desktop { display:none; }
  .hint.mobile { display:none; }
  body.touch .hint.mobile { display:block; }
  body.ready .brand, body.ready .tag, body.ready .joy { opacity:1; }
  body.ready .title-card, body.ready .hint { opacity:1; }
  .skip { position:fixed; bottom:1.4rem; right:1.4rem; z-index:12; background:rgba(255,255,255,.75); border:1px solid rgba(0,0,0,.12);
    color:#1a1a1a; font-size:.8rem; padding:.55rem 1rem; border-radius:2rem; cursor:pointer;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); font-family:inherit; }
  .skip.hidden { display:none; }
  .err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; color:rgba(0,0,0,.7); z-index:20; text-align:center; padding:2rem; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
  <a class="brand" href="/"><span class="monogram">AX</span><span class="brand-name">Aditya X</span></a>
  <span class="tag">Home · v1</span>
  <div class="title-card" id="titleCard"><h1>Meet <span>Kalam</span> 🖊️</h1><p>A living ink doodle. Joystick to walk · swipe to look around.</p></div>
  <div class="hint desktop" id="hintD">WASD to walk · drag to look around</div>
  <div class="hint mobile" id="hintM">Right joystick to walk · swipe to look around</div>
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
  <button class="skip" id="skip">Skip intro →</button>
  <div class="err" id="err">WebGL isn&rsquo;t available on this device, so the house can&rsquo;t open.</div>

<script type="module">
import * as THREE from 'three';

if (!window.WebGLRenderingContext) { document.getElementById('err').style.display = 'flex'; throw new Error('no webgl'); }
if ('ontouchstart' in window) document.body.classList.add('touch');

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.className = 'webgl';
document.body.appendChild(renderer.domElement);

const PAPER = 0xf4f1ea;
const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
scene.fog = new THREE.Fog(PAPER, 30, 70);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 140);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c2, 0.8));
const sun = new THREE.DirectionalLight(0xfff6e8, 1.5);
sun.position.set(9, 15, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 55;
sun.shadow.bias = -0.0004;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xf13343, 0.25);
rim.position.set(-9, 6, -9); scene.add(rim);

/* ---------- helpers ---------- */
function bx(w,h,d,color,x,y,z,ry=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({ color, roughness:0.85 }));
  m.position.set(x,y,z); m.rotation.y = ry; m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function cyl(rt,rb,h,color,x,y,z,seg=20,parent=scene){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), new THREE.MeshStandardMaterial({ color, roughness:0.8 }));
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function canvasTex(w,h,draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function frame(w,h,tex,x,y,z,ry=0){
  const g = new THREE.Group();
  const f = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.1), new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.6 }));
  f.castShadow = true;
  const a = new THREE.Mesh(new THREE.PlaneGeometry(w-0.3,h-0.3), new THREE.MeshStandardMaterial({ map:tex, roughness:0.9 }));
  a.position.z = 0.06; g.add(f,a); g.position.set(x,y,z); g.rotation.y = ry; scene.add(g); return g;
}

/* ---------- exterior ground ---------- */
const lawn = new THREE.Mesh(new THREE.PlaneGeometry(140,140), new THREE.MeshStandardMaterial({ color:0xdde3d0, roughness:1 }));
lawn.rotation.x = -Math.PI/2; lawn.position.y = -0.02; lawn.receiveShadow = true; scene.add(lawn);

/* ---------- house ---------- */
const RW = 30, RD = 20, WH = 6;
// wooden floor
const woodTex = canvasTex(512,512,(g)=>{
  g.fillStyle = '#dcc49c'; g.fillRect(0,0,512,512);
  for (let y=0;y<512;y+=64){ g.fillStyle = 'rgba(120,85,50,.28)'; g.fillRect(0,y,512,3);
    for (let x=0;x<512;x+=128){ const off = ((y/64)%2)*64; g.fillRect((x+off)%512, y, 3, 64); } }
  g.fillStyle = 'rgba(255,255,255,.06)';
  for (let i=0;i<200;i++) g.fillRect(Math.random()*512, Math.random()*512, 2, 2);
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(6,4);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW,RD), new THREE.MeshStandardMaterial({ map:woodTex, roughness:0.8 }));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

const rug = new THREE.Mesh(new THREE.CircleGeometry(4.4,48), new THREE.MeshStandardMaterial({ color:0xded6c2, roughness:1 }));
rug.rotation.x = -Math.PI/2; rug.position.set(0,0.005,2); rug.receiveShadow = true; scene.add(rug);

const wallMat = new THREE.MeshStandardMaterial({ color:0xefece2, roughness:0.9 });
function wall(w,h,x,y,z,ry){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.4), wallMat);
  m.position.set(x,y,z); m.rotation.y = ry; m.receiveShadow = true; m.castShadow = true; scene.add(m);
}
wall(RW,WH, 0,WH/2,-RD/2, 0);                    // back
wall(RD,WH, -RW/2,WH/2,0, Math.PI/2);            // left
wall(RD,WH,  RW/2,WH/2,0, Math.PI/2);            // right
// front wall with door opening (x -1.1..1.1, h 3.2)
wall(13.9,WH, -8.05,WH/2, RD/2, 0);
wall(13.9,WH,  8.05,WH/2, RD/2, 0);
wall(2.2,WH-3.2, 0,3.2+(WH-3.2)/2, RD/2, 0);
// baseboards
const bbMat = new THREE.MeshStandardMaterial({ color:0xf8f5ee, roughness:0.8 });
[[0,-9.78,0],[-14.78,0,Math.PI/2],[14.78,0,Math.PI/2],[0,9.78,0]].forEach(([x,z,ry])=>{
  const b = new THREE.Mesh(new THREE.BoxGeometry(ry?0.12:RW, 0.28, ry?RD:0.12), bbMat);
  b.position.set(x,0.14,z); scene.add(b);
});
// red accent strip
const strip = new THREE.Mesh(new THREE.BoxGeometry(RW,0.12,0.06),
  new THREE.MeshStandardMaterial({ color:0xf13343, emissive:0xf13343, emissiveIntensity:0.55 }));
strip.position.set(0,0.42,-RD/2+0.24); scene.add(strip);

// door (pivot at hinge)
const doorPivot = new THREE.Group(); doorPivot.position.set(-1.1,0,RD/2); scene.add(doorPivot);
{
  const panel = bx(2.2,3.2,0.12, 0xb8442f, 1.1,1.6,0, 0, doorPivot);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.07,12,12), new THREE.MeshStandardMaterial({ color:0xf5f0e6, roughness:0.4 }));
  knob.position.set(1.85,1.6,0.12); doorPivot.add(knob);
  bx(0.24,3.4,0.5, 0xf8f5ee, -1.22,1.7,RD/2); bx(0.24,3.4,0.5, 0xf8f5ee, 1.22,1.7,RD/2);
  bx(2.68,0.24,0.5, 0xf8f5ee, 0,3.44,RD/2);
  bx(3.2,0.12,1.4, 0xcfc8b8, 0,0.06,RD/2+0.9); // doorstep
}
// front windows (warm glowing)
[[-5],[5]].forEach(([x])=>{
  bx(0.24,2.5,3.2, 0xf8f5ee, x,3.4,RD/2);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(2.7,2.0),
    new THREE.MeshStandardMaterial({ color:0xffe3b0, emissive:0xffc98a, emissiveIntensity:0.9 }));
  glass.position.set(x,3.4,RD/2+0.14); scene.add(glass);
});
// welcome plaque outside, by the door
{
  const tex = canvasTex(512,220,(g)=>{
    g.fillStyle='#ffffff'; g.fillRect(0,0,512,220);
    g.strokeStyle='rgba(0,0,0,.15)'; g.lineWidth=6; g.strokeRect(10,10,492,200);
    g.fillStyle='#1a1a1a'; g.textAlign='center'; g.font='700 44px Georgia,serif';
    g.fillText('The door is open.',256,95);
    g.fillStyle='#f13343'; g.font='500 34px Inter,sans-serif';
    g.fillText('dradityax@gmail.com',256,160);
  });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.03), new THREE.MeshStandardMaterial({ map:tex, roughness:0.9 }));
  p.position.set(3.1,2.3,RD/2+0.22); scene.add(p);
}
// path + bushes
for (let i=0;i<4;i++) bx(1.7,0.07,1.15, 0xcfc8b8, 0,0.035,RD/2+1.8+i*1.5);
[[-2.7],[2.7]].forEach(([x])=>{
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.6,14,14), new THREE.MeshStandardMaterial({ color:0x7aa36b, roughness:0.95 }));
  b.position.set(x,0.5,RD/2+1.2); b.castShadow = true; scene.add(b);
});

// roof (hidden once camera goes inside)
const roofGroup = new THREE.Group(); scene.add(roofGroup);
{
  const roofMat = new THREE.MeshStandardMaterial({ color:0xbf5f4c, roughness:0.85 });
  const mk = (z,rx)=>{ const p = new THREE.Mesh(new THREE.BoxGeometry(RW+2.4,0.22,11.5), roofMat);
    p.position.set(0,7.3,z); p.rotation.x = rx; p.castShadow = true; roofGroup.add(p); };
  mk(-5.5,-0.232); mk(5.5,0.232);
  const tri = new THREE.Shape(); tri.moveTo(-10,0); tri.lineTo(10,0); tri.lineTo(0,2.6); tri.closePath();
  const gg = new THREE.ExtrudeGeometry(tri,{ depth:0.4, bevelEnabled:false });
  const g1 = new THREE.Mesh(gg, wallMat); g1.rotation.y = Math.PI/2; g1.position.set(-15.2,6,0); roofGroup.add(g1);
  const g2 = new THREE.Mesh(gg, wallMat); g2.rotation.y = -Math.PI/2; g2.position.set(15.2,6,0); roofGroup.add(g2);
  const ch = new THREE.Mesh(new THREE.BoxGeometry(1.1,2.4,1.1), new THREE.MeshStandardMaterial({ color:0x9a8a7a, roughness:0.9 }));
  ch.position.set(8,9.3,-4); ch.castShadow = true; roofGroup.add(ch);
}

/* ---------- interior furniture ---------- */
const sofa = new THREE.Group();
{
  const c = 0xd8cdb6, cd = 0xc9bc9f;
  bx(2.6,0.55,1.1,c,0,0.45,0,0,sofa); bx(2.6,0.95,0.32,c,0,1.05,-0.42,0,sofa);
  bx(0.32,0.8,1.1,c,-1.16,0.8,0,0,sofa); bx(0.32,0.8,1.1,c,1.16,0.8,0,0,sofa);
  bx(1.1,0.2,0.95,cd,-0.6,0.82,0.02,0,sofa); bx(1.1,0.2,0.95,cd,0.6,0.82,0.02,0,sofa);
  bx(0.5,0.5,0.16,0xf13343,-0.6,1.15,-0.28,0.2,sofa);
  sofa.position.set(-11,0,-3.5); sofa.rotation.y = Math.PI/2; scene.add(sofa);
}
cyl(0.05,0.05,0.45,0x8a6f52,-8.6,0.22,-3.9); cyl(0.05,0.05,0.45,0x8a6f52,-7.4,0.22,-3.9);
cyl(0.05,0.05,0.45,0x8a6f52,-8.6,0.22,-3.1); cyl(0.05,0.05,0.45,0x8a6f52,-7.4,0.22,-3.1);
bx(1.7,0.09,1.0,0xa5825e,-8,0.5,-3.5); // coffee table
cyl(0.28,0.32,0.08,0x3a3a3a,11.5,0.04,-6.5); cyl(0.05,0.05,2.3,0x3a3a3a,11.5,1.2,-6.5);
{
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.52,0.55,20,1,true),
    new THREE.MeshStandardMaterial({ color:0xf5ead0, roughness:0.7, side:THREE.DoubleSide }));
  shade.position.set(11.5,2.5,-6.5); shade.castShadow = true; scene.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.09,12,12),
    new THREE.MeshStandardMaterial({ color:0xffe2ae, emissive:0xffc46b, emissiveIntensity:2.2 }));
  bulb.position.set(11.5,2.38,-6.5); scene.add(bulb);
  const pl = new THREE.PointLight(0xffd9a0, 18, 16, 2); pl.position.set(11.5,2.3,-6.5); scene.add(pl);
}
{
  const g = new THREE.Group(); const wood = 0x9a7b58;
  bx(0.12,3.0,0.55,wood,-1.05,1.5,0,0,g); bx(0.12,3.0,0.55,wood,1.05,1.5,0,0,g);
  bx(2.22,0.12,0.55,wood,0,2.94,0,0,g); bx(2.22,0.12,0.55,wood,0,0.12,0,0,g);
  const cols = [0xf13343,0x3a6ea5,0x4a9e6b,0xe8b93c,0x7a5fa0,0xd97b3f];
  [0.75,1.55,2.35].forEach(sy=>{
    bx(1.98,0.08,0.5,wood,0,sy,0,0,g);
    let bx0 = -0.88;
    while (bx0 < 0.8){ const bw = 0.1+Math.random()*0.09, bh = 0.42+Math.random()*0.24;
      bx(bw,bh,0.34,cols[(Math.random()*cols.length)|0],bx0+bw/2,sy+0.04+bh/2,0,0,g); bx0 += bw+0.025; }
  });
  g.position.set(9.5,0,-9.3); scene.add(g);
}
cyl(0.34,0.26,0.5,0xb5654a,-12.5,0.25,-7.5);
{
  const leaf = new THREE.MeshStandardMaterial({ color:0x5f9159, roughness:0.9 });
  [[0,0.95,0,0.42],[0.25,1.2,0.1,0.32],[-0.22,1.15,-0.08,0.3]].forEach(([x,y,z,r])=>{
    const s = new THREE.Mesh(new THREE.SphereGeometry(r,14,14), leaf);
    s.position.set(-12.5+x,y,-7.5+z); s.castShadow = true; scene.add(s);
  });
}

/* ---------- content as interior ---------- */
// hero plaque (right wall)
frame(7,3.5, canvasTex(1024,512,(g)=>{
  g.fillStyle='#ffffff'; g.fillRect(0,0,1024,512);
  g.strokeStyle='rgba(0,0,0,.14)'; g.lineWidth=8; g.strokeRect(18,18,988,476);
  g.textAlign='center'; g.fillStyle='#1a1a1a';
  g.font='700 150px Georgia,serif'; g.fillText('Aditya X',512,200);
  g.font='italic 500 52px Georgia,serif'; g.fillStyle='rgba(0,0,0,.65)';
  g.fillText('student of medicine',512,290);
  g.font='500 34px Inter,sans-serif'; g.fillStyle='rgba(0,0,0,.45)';
  g.fillText('EST. 2026 · STILL BECOMING',512,360);
  g.fillStyle='#f13343'; g.font='italic 500 40px Georgia,serif';
  g.fillText('— mortui vivos docent —',512,430);
}), 14.72,3.4,0, -Math.PI/2);
// specimen jars (latin words) on shelf under plaque
bx(0.55,0.09,2.6, 0x9a7b58, 14.55,1.55,2);
[['MEDICINAE\nSTUDIOSUS',1.2],['MORTUI VIVOS\nDOCENT',2.0],['EST.\n2026',2.8]].forEach(([label,z])=>{
  const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.72,18),
    new THREE.MeshStandardMaterial({ color:0xdfe8ea, transparent:true, opacity:0.35, roughness:0.2 }));
  jar.position.set(14.55,1.96,z); scene.add(jar);
  const lt = canvasTex(256,160,(g)=>{ g.fillStyle='#f7f3e8'; g.fillRect(0,0,256,160);
    g.fillStyle='#1a1a1a'; g.textAlign='center'; g.font='700 30px Inter,sans-serif';
    label.split('\n').forEach((ln,i)=>g.fillText(ln,128,70+i*40)); });
  const lp = new THREE.Mesh(new THREE.PlaneGeometry(0.4,0.25), new THREE.MeshStandardMaterial({ map:lt, roughness:0.9 }));
  lp.position.set(14.26,1.96,z); lp.rotation.y = -Math.PI/2; scene.add(lp);
});
// 8 chapter frames (back wall, 2 rows)
const chapters = ['a warrior wakes. a god waits.','white cloth. yellow sash. one promise.',
  'he carries light into the dark.','answers hide in old pages.','ash, embers, no turning back.',
  'the temple does not open for everyone.','one step between man and myth.','he searched the sky — and the sky answered.'];
chapters.forEach((line,i)=>{
  const tex = canvasTex(256,340,(g)=>{
    g.fillStyle='#ffffff'; g.fillRect(0,0,256,340);
    g.strokeStyle='rgba(0,0,0,.15)'; g.lineWidth=6; g.strokeRect(12,12,232,316);
    g.textAlign='center'; g.fillStyle='#f13343'; g.font='900 64px Inter,sans-serif';
    g.fillText('0'+(i+1),128,110);
    g.fillStyle='rgba(0,0,0,.72)'; g.font='italic 500 25px Georgia,serif';
    const words = line.split(' '); let ln='', y=180;
    words.forEach(w=>{ if ((ln+' '+w).length>20){ g.fillText(ln,128,y); y+=34; ln=w; } else ln+=' '+w; });
    g.fillText(ln,128,y);
    g.fillStyle='rgba(0,0,0,.35)'; g.font='500 20px Inter,sans-serif'; g.fillText('chapter',128,300);
  });
  const row = i<4?0:1, col = i%4;
  frame(1.9,2.5,tex, -9.75+col*3.5, row?2.0:4.5, -9.55);
});
// anatomy sketches (left wall)
[['heart',-1],['ribcage',1.2]].forEach(([kind,z])=>{
  const tex = canvasTex(256,340,(g)=>{
    g.fillStyle='#fbf8f1'; g.fillRect(0,0,256,340);
    g.strokeStyle='#1a1a1a'; g.lineWidth=3; g.lineCap='round';
    if (kind==='heart'){
      g.beginPath(); g.moveTo(128,220);
      g.bezierCurveTo(60,150,70,80,128,110); g.bezierCurveTo(186,80,196,150,128,220); g.stroke();
      for(let i=0;i<4;i++){ g.beginPath(); g.moveTo(90+i*24,240); g.lineTo(84+i*26,290); g.stroke(); }
    } else {
      for(let i=0;i<5;i++){ g.beginPath(); g.arc(128,90+i*34,70-i*7,0.3,Math.PI-0.3); g.stroke(); }
      g.beginPath(); g.moveTo(128,60); g.lineTo(128,250); g.stroke();
    }
    g.fillStyle='rgba(0,0,0,.4)'; g.textAlign='center'; g.font='italic 500 22px Georgia,serif';
    g.fillText('ink sketches of the body',128,312);
  });
  frame(1.7,2.3,tex, -14.72,3.2,z, Math.PI/2);
});
// faceless portrait (left wall)
frame(1.7,2.3, canvasTex(256,340,(g)=>{
  g.fillStyle='#fbf8f1'; g.fillRect(0,0,256,340);
  g.fillStyle='#1a1a1a';
  g.beginPath(); g.arc(128,140,62,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(128,260,80,52,0,0,Math.PI*2); g.fill();
  g.fillStyle='rgba(0,0,0,.4)'; g.textAlign='center'; g.font='italic 500 21px Georgia,serif';
  g.fillText('faceless, but',128,300); g.fillText('unmistakably mine.',128,324);
}), -14.72,3.2,3.6, Math.PI/2);
// diary on coffee table (about)
{
  const tex = canvasTex(512,300,(g)=>{
    g.fillStyle='#fdfbf5'; g.fillRect(0,0,512,300);
    g.fillStyle='#1a1a1a'; g.textAlign='left'; g.font='italic 500 27px Georgia,serif';
    const t='Some people collect stamps. I collect systems — the ones inside the human body. The coat does not fit yet, and that is fine — the learning fits.';
    const words=t.split(' '); let ln='',y=60;
    words.forEach(w=>{ if ((ln+' '+w).length>38){ g.fillText(ln,36,y); y+=42; ln=w; } else ln+=' '+w; });
    g.fillText(ln,36,y);
  });
  const pg = new THREE.MeshStandardMaterial({ map:tex, roughness:0.95 });
  const L = new THREE.Mesh(new THREE.BoxGeometry(0.75,0.03,0.55), pg);
  L.position.set(-8.38,0.62,-3.5); L.rotation.z = 0.06; L.castShadow = true; scene.add(L);
  const R = new THREE.Mesh(new THREE.BoxGeometry(0.75,0.03,0.55), pg);
  R.position.set(-7.62,0.62,-3.5); R.rotation.z = -0.06; R.castShadow = true; scene.add(R);
}

const colliders = [
  { x:-11, z:-3.5, r:2.0 }, { x:-8, z:-3.5, r:1.15 },
  { x:11.5, z:-6.5, r:0.6 }, { x:9.5, z:-9.0, r:1.7 },
  { x:-12.5, z:-7.5, r:0.85 },
];

/* ---------- Kalam: living ink scribble ---------- */
const scribbleMat = new THREE.LineBasicMaterial({ color:0x111111 });
function scribbleMesh(rx,ry,rz,count,step){
  const pts = []; const p = new THREE.Vector3((Math.random()-.5)*.1,(Math.random()-.5)*.1,(Math.random()-.5)*.1);
  for (let i=0;i<count;i++){
    p.x += (Math.random()-.5)*step; p.y += (Math.random()-.5)*step; p.z += (Math.random()-.5)*step;
    const l = Math.sqrt((p.x/rx)**2 + (p.y/ry)**2 + (p.z/rz)**2);
    if (l > 1) p.multiplyScalar(0.9/l);
    pts.push(p.x,p.y,p.z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  const line = new THREE.Line(g, scribbleMat); line.frustumCulled = false; return line;
}
const scrib = new THREE.Group();
const headS = scribbleMesh(0.34,0.34,0.34,1500,0.13); headS.position.y = 1.62; scrib.add(headS);
const torsoS = scribbleMesh(0.26,0.34,0.22,950,0.11); torsoS.position.y = 1.02; scrib.add(torsoS);
function scribLimb(x,y,r,len){
  const pivot = new THREE.Group(); pivot.position.set(x,y,0);
  const s = scribbleMesh(r,len/2,r,260,0.07); s.position.y = -len/2;
  pivot.add(s); scrib.add(pivot); return pivot;
}
const armL = scribLimb(-0.36,1.28,0.085,0.42), armR = scribLimb(0.36,1.28,0.085,0.42);
const legL = scribLimb(-0.15,0.74,0.1,0.5),  legR = scribLimb(0.15,0.74,0.1,0.5);
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.34,1), new THREE.MeshBasicMaterial({ color:0x111111 }));
core.scale.set(0.85,1.5,0.75); core.position.y = 1.05; core.castShadow = true; scrib.add(core);
scrib.position.set(0,0,-1); scrib.visible = false;
scene.add(scrib);

/* ---------- footprints ---------- */
const prints = []; const printGeo = new THREE.CircleGeometry(0.11,12);
for (let i=0;i<48;i++){
  const m = new THREE.Mesh(printGeo, new THREE.MeshBasicMaterial({ color:0xb3ab99, transparent:true, opacity:0 }));
  m.rotation.x = -Math.PI/2; m.position.y = 0.015; m.visible = false; scene.add(m); prints.push({ m, life:0 });
}
let printIdx = 0, printSide = 1;
function spawnPrint(x,z,facing){
  const p = prints[printIdx]; printIdx = (printIdx+1)%prints.length;
  p.m.position.set(x - Math.sin(facing)*0.16*printSide, 0.015, z - Math.cos(facing)*0.16*printSide);
  p.m.rotation.z = -facing; p.life = 2.4; p.m.visible = true; printSide *= -1;
}

/* ---------- input (gated by intro) ---------- */
let introDone = false;
const keys = {};
addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e=>{ keys[e.key.toLowerCase()] = false; });
const joy = { dx:0, dy:0 };
const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
let joyId = null;
function joyMove(e){
  const r = joyEl.getBoundingClientRect(); const cx = r.left+r.width/2, cy = r.top+r.height/2;
  let dx = e.clientX-cx, dy = e.clientY-cy;
  const max = 42, d = Math.hypot(dx,dy);
  if (d > max){ dx = dx/d*max; dy = dy/d*max; }
  knob.style.transform = 'translate('+dx+'px,'+dy+'px)'; joy.dx = dx/max; joy.dy = dy/max;
}
joyEl.addEventListener('pointerdown', e=>{ if(!introDone) return; joyId = e.pointerId; joyEl.setPointerCapture(joyId); joyMove(e); e.stopPropagation(); });
joyEl.addEventListener('pointermove', e=>{ if(e.pointerId===joyId) joyMove(e); });
function joyEnd(e){ if(e.pointerId===joyId){ joyId=null; joy.dx=0; joy.dy=0; knob.style.transform=''; } }
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);

let camAngle = 0; const CAM_R = 8.8, CAM_H = 6.4;
let dragId = null, lastX = 0;
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', e=>{ if(!introDone) return; dragId = e.pointerId; lastX = e.clientX; cvs.setPointerCapture(dragId); });
cvs.addEventListener('pointermove', e=>{ if(e.pointerId!==dragId) return; camAngle -= (e.clientX-lastX)*0.0055; lastX = e.clientX; });
function dragEnd(e){ if(e.pointerId===dragId) dragId = null; }
cvs.addEventListener('pointerup', dragEnd); cvs.addEventListener('pointercancel', dragEnd);

/* ---------- intro cinematic ---------- */
const INTRO = [
  { t:0.0, p:[0,10,34],   l:[0,4,10] },
  { t:2.4, p:[0,5,17],    l:[0,2.8,10] },
  { t:4.0, p:[0,2.8,12],  l:[0,2.2,6] },
  { t:5.6, p:[0,4.2,4],   l:[0,1.5,-2] },
  { t:7.0, p:[0,6.4,7.8], l:[0,0.9,-1] },
];
let introT = 0; const INTRO_END = 7.0;
const smooth = t => t*t*(3-2*t);
function easeOutBack(t){ const c=1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); }
function finishIntro(){
  if (introDone) return;
  introDone = true; introT = INTRO_END;
  doorPivot.rotation.y = 1.85; roofGroup.visible = false;
  scrib.visible = true; scrib.scale.setScalar(1);
  camera.position.set(0,6.4,7.8); camera.lookAt(0,0.9,-1);
  document.body.classList.add('ready');
  document.getElementById('skip').classList.add('hidden');
  setTimeout(()=>{ document.getElementById('titleCard').style.opacity='0';
    ['hintD','hintM'].forEach(id=>{ const el=document.getElementById(id); if(el) setTimeout(()=>el.style.opacity='0',6000); });
  }, 2600);
}
document.getElementById('skip').addEventListener('click', finishIntro);

/* ---------- loop ---------- */
const vel = new THREE.Vector3(); const clock = new THREE.Clock();
let faceAngle = 0, distAcc = 0, elapsed = 0, started = false;
function angleLerp(a,b,t){
  let d = (b-a)%(Math.PI*2);
  if (d > Math.PI) d -= Math.PI*2; if (d < -Math.PI) d += Math.PI*2;
  return a + d*t;
}
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05); elapsed += dt;

  if (!introDone){
    introT += dt;
    if (introT >= INTRO_END){ finishIntro(); }
    else {
      let i = 0;
      while (i < INTRO.length-2 && introT > INTRO[i+1].t) i++;
      const A = INTRO[i], B = INTRO[i+1];
      const k = smooth(THREE.MathUtils.clamp((introT-A.t)/(B.t-A.t),0,1));
      camera.position.set(
        A.p[0]+(B.p[0]-A.p[0])*k, A.p[1]+(B.p[1]-A.p[1])*k, A.p[2]+(B.p[2]-A.p[2])*k);
      camera.lookAt(
        A.l[0]+(B.l[0]-A.l[0])*k, A.l[1]+(B.l[1]-A.l[1])*k, A.l[2]+(B.l[2]-A.l[2])*k);
      doorPivot.rotation.y = 1.85 * smooth(THREE.MathUtils.clamp((introT-2.4)/1.8,0,1));
      if (introT >= 4.0) roofGroup.visible = false;
      if (introT > 6.2){ scrib.visible = true; scrib.scale.setScalar(Math.max(0.001, easeOutBack(THREE.MathUtils.clamp((introT-6.2)/0.8,0,1)))); }
    }
    renderer.render(scene,camera); return;
  }

  let ix = ((keys['d']||keys['arrowright'])?1:0) - ((keys['a']||keys['arrowleft'])?1:0) + joy.dx;
  let iz = ((keys['s']||keys['arrowdown'])?1:0) - ((keys['w']||keys['arrowup'])?1:0) + joy.dy;
  const il = Math.hypot(ix,iz); if (il > 1){ ix/=il; iz/=il; }
  const fx = -Math.sin(camAngle), fz = -Math.cos(camAngle);
  const rx = Math.cos(camAngle),  rz = -Math.sin(camAngle);
  const mx = fx*(-iz)+rx*ix, mz = fz*(-iz)+rz*ix;
  const SPEED = 4.2, k = 1-Math.exp(-10*dt);
  vel.x += (mx*SPEED-vel.x)*k; vel.z += (mz*SPEED-vel.z)*k;
  scrib.position.x = THREE.MathUtils.clamp(scrib.position.x+vel.x*dt, -RW/2+1.2, RW/2-1.2);
  scrib.position.z = THREE.MathUtils.clamp(scrib.position.z+vel.z*dt, -RD/2+1.2, RD/2-1.5);
  for (const c of colliders){
    const dx = scrib.position.x-c.x, dz = scrib.position.z-c.z, d = Math.hypot(dx,dz);
    if (d < c.r && d > 0.001){ scrib.position.x = c.x+dx/d*c.r; scrib.position.z = c.z+dz/d*c.r; }
  }
  const spd = Math.hypot(vel.x,vel.z), walkAmt = Math.min(1,spd/3);
  if (spd > 0.4){
    faceAngle = angleLerp(faceAngle, Math.atan2(vel.x,vel.z), 1-Math.exp(-12*dt));
    scrib.rotation.y = faceAngle;
    const sw = Math.sin(elapsed*11)*0.7*walkAmt;
    armL.rotation.x = sw; armR.rotation.x = -sw; legL.rotation.x = -sw; legR.rotation.x = sw;
    scrib.position.y = Math.abs(Math.cos(elapsed*11))*0.06*walkAmt;
    distAcc += spd*dt;
    if (distAcc > 0.38){ spawnPrint(scrib.position.x,scrib.position.z,faceAngle); distAcc = 0; }
    if (!started){ started = true; document.getElementById('titleCard').style.opacity='0'; }
  } else {
    armL.rotation.x *= 0.9; armR.rotation.x *= 0.9; legL.rotation.x *= 0.9; legR.rotation.x *= 0.9;
    scrib.position.y *= 0.9; scrib.rotation.z = Math.sin(elapsed*1.6)*0.02;
  }
  for (const p of prints) if (p.life > 0){
    p.life -= dt; p.m.material.opacity = Math.max(0,p.life/2.4)*0.55;
    if (p.life <= 0) p.m.visible = false;
  }
  const cx = THREE.MathUtils.clamp(scrib.position.x+Math.sin(camAngle)*CAM_R, -RW/2+1.5, RW/2-1.5);
  const cz = THREE.MathUtils.clamp(scrib.position.z+Math.cos(camAngle)*CAM_R, -RD/2+1.5, RD/2-1.5);
  const ck = 1-Math.exp(-4*dt);
  camera.position.x += (cx-camera.position.x)*ck;
  camera.position.y += (CAM_H-camera.position.y)*ck;
  camera.position.z += (cz-camera.position.z)*ck;
  camera.lookAt(scrib.position.x, 0.9, scrib.position.z);
  renderer.render(scene,camera);
}
tick();
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
