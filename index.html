<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:pan-y}
/* ---------- liquid glass base ---------- */
.glass{background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.05));
 -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
 border:1px solid rgba(255,255,255,.28);border-radius:22px;
 box-shadow:0 12px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.08)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.22),transparent 55%)}
/* ---------- layers ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;opacity:0;transition:opacity 1.1s ease}
#bg.show{opacity:1}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.1s ease;
 background:linear-gradient(100deg,rgba(0,0,0,.60) 0%,rgba(0,0,0,.26) 36%,rgba(0,0,0,.06) 62%,rgba(0,0,0,.34) 100%)}
#shade.show{opacity:1}
#flash{position:fixed;inset:0;background:#fff;z-index:40;opacity:0;pointer-events:none;transition:opacity .38s ease}
#flash.on{opacity:1}
/* ---------- header : intro typing, stays fixed ---------- */
.brand{position:fixed;top:max(4vh,20px);left:50%;transform:translateX(-50%);z-index:10;
 padding:.9rem 2rem 1rem;text-align:center;position:fixed}
.brand h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;letter-spacing:.02em;line-height:1;white-space:nowrap;
 color:#fff;text-shadow:0 0 18px rgba(255,255,255,.45),0 2px 14px rgba(0,0,0,.5)}
.brand h1 .lt{display:inline-block;opacity:0;will-change:transform}
.brand h1 .lt.in{opacity:1}
.caret{display:inline-block;width:.09em;height:1em;background:#fff;margin-left:.08em;vertical-align:-.1em;border-radius:2px;
 box-shadow:0 0 12px rgba(255,255,255,.8);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.brand p{margin-top:.55rem;font-size:.68rem;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.75);
 font-weight:600;text-shadow:0 0 10px rgba(255,255,255,.35);opacity:0;transition:opacity .8s ease}
.brand p.show{opacity:1}
/* ---------- lyrics : apple style karaoke ---------- */
.lyrics{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;
 padding:1.4rem 2.6rem;opacity:0;transition:opacity 1s ease;max-width:92vw}
.lyrics.show{opacity:1}
.lyrics .w{display:inline-block;margin:0 .16em;font-size:clamp(1.7rem,4.4vw,3.2rem);font-weight:800;letter-spacing:-.02em;
 color:rgba(255,255,255,.30);text-shadow:0 0 12px rgba(255,255,255,.18);
 transition:color .5s ease,transform .5s cubic-bezier(.2,1.4,.4,1),text-shadow .5s ease;will-change:transform}
.lyrics .w.on{color:#fff;transform:scale(1.07);text-shadow:0 0 26px rgba(255,255,255,.65),0 2px 12px rgba(0,0,0,.4)}
/* ---------- handles : right side, draggable ---------- */
.handles{position:fixed;right:max(3vw,14px);top:50%;transform:translateY(-50%);z-index:10;
 display:flex;flex-direction:column;gap:.95rem}
.hbtn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;
 position:relative;cursor:grab;opacity:0;transform:scale(.3);user-select:none;-webkit-user-select:none;touch-action:none}
.hbtn.pop{animation:pop .75s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.hbtn.glass{border-radius:50%}
.hbtn svg{width:25px;height:25px;fill:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.35));pointer-events:none}
.hbtn.drag{opacity:1;transform:scale(1.18);z-index:60;cursor:grabbing;transition:none}
.handles.wiggle .hbtn{animation:wiggle .42s ease-in-out infinite}
.handles.wiggle .hbtn:nth-child(2n){animation-delay:.1s}
.handles.wiggle .hbtn:nth-child(3n){animation-delay:.2s}
@keyframes wiggle{0%,100%{rotate:-4deg}50%{rotate:4deg}}
/* ---------- apple app-open : icon zooms into page ---------- */
.appopen{position:fixed;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;
 overflow:hidden;pointer-events:none;border-radius:50%;
 transition:left .55s cubic-bezier(.32,.72,0,1),top .55s cubic-bezier(.32,.72,0,1),width .55s cubic-bezier(.32,.72,0,1),height .55s cubic-bezier(.32,.72,0,1),border-radius .55s ease,opacity .45s ease}
.appopen.go{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0}
.appopen.fade{opacity:0}
.appopen .ao-logo svg{width:88px;height:88px;fill:#fff;filter:drop-shadow(0 0 20px rgba(255,255,255,.45))}
.appopen .ao-label{font-size:.78rem;letter-spacing:.36em;text-transform:uppercase;color:rgba(255,255,255,.88);font-weight:600;text-shadow:0 0 12px rgba(255,255,255,.4)}
/* ---------- sound ---------- */
#snd{position:fixed;right:1.1rem;bottom:1.1rem;z-index:20;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.28);
 cursor:pointer;color:#fff;font-size:1.05rem;position:fixed}
#snd.glass{border-radius:50%}
.hint{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:5;font-size:.66rem;letter-spacing:.3em;
 text-transform:uppercase;color:rgba(255,255,255,.5);opacity:0;transition:opacity 1s ease;pointer-events:none;text-align:center}
.hint.show{opacity:1}
@media (max-width:820px){
 .brand{padding:.7rem 1.4rem .8rem}

 .hbtn svg{width:21px;height:21px}
}
@media (prefers-reduced-motion:reduce){
 .hbtn,.caret{animation:none!important}
}
</style>

<script>
(function(){
"use strict";
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var $ = function(id){ return document.getElementById(id); };
var bg=$("bg"), shade=$("shade"), flash=$("flash"), brand=$("brand"),
    nameEl=$("name"), sub=$("sub"), lyrics=$("lyrics"),
    handles=$("handles"), hint=$("hint"), sndBtn=$("snd");

/* ================= audio : typing clicks ================= */
var actx=null, soundOn=true;
function ensureAudio(){
  if(actx) return;
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }catch(e){}
}
function click(){
  if(!soundOn||!actx||actx.state!=="running") return;
  try{
    var t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain(), f=actx.createBiquadFilter();
    o.type="square"; o.frequency.value=1300+Math.random()*1000;
    f.type="bandpass"; f.frequency.value=2300; f.Q.value=1.1;
    g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(f); f.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+0.06);
  }catch(e){}
}
["pointerdown","keydown","touchstart"].forEach(function(ev){
  window.addEventListener(ev,function(){ ensureAudio(); if(actx&&actx.state==="suspended") actx.resume(); },{passive:true});
});
sndBtn.addEventListener("click",function(e){
  e.stopPropagation(); soundOn=!soundOn;
  sndBtn.textContent = soundOn ? "🔊" : "🔇";
  if(soundOn){ ensureAudio(); if(actx&&actx.state==="suspended") actx.resume(); }
});

/* ================= scatter-text : play with letters ================= */
var letters=[];
function track(el){
  var r=el.getBoundingClientRect();
  letters.push({el:el, x:0, y:0, vx:0, vy:0,
    cx:r.left+r.width/2, cy:r.top+r.height/2});
}
function refresh(){
  for(var i=0;i<letters.length;i++){
    var L=letters[i], r=L.el.getBoundingClientRect();
    L.cx=r.left+r.width/2 - L.x; L.cy=r.top+r.height/2 - L.y;
  }
}
var px=-9999, py=-9999, pActive=false;
window.addEventListener("pointermove",function(e){
  px=e.clientX; py=e.clientY; pActive=true;
},{passive:true});
window.addEventListener("pointerleave",function(){ pActive=false; });
window.addEventListener("touchend",function(){ pActive=false; });
var R=130;
function physics(){
  requestAnimationFrame(physics);
  if(reduce) return;
  for(var i=0;i<letters.length;i++){
    var L=letters[i];
    var dx=(L.cx+L.x)-px, dy=(L.cy+L.y)-py;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(pActive && d<R && d>1){
      var f=(1-d/R)*14;
      L.vx+=dx/d*f; L.vy+=dy/d*f;
    }
    L.vx=(L.vx - L.x*0.12)*0.86;
    L.vy=(L.vy - L.y*0.12)*0.86;
    L.x+=L.vx; L.y+=L.vy;
    if(Math.abs(L.x)>0.3||Math.abs(L.y)>0.3||Math.abs(L.vx)>0.05||Math.abs(L.vy)>0.05){
      L.el.style.transform="translate("+L.x.toFixed(1)+"px,"+L.y.toFixed(1)+"px) rotate("+(L.x*0.25).toFixed(1)+"deg)";
    } else if(L.el.style.transform){
      L.el.style.transform="";
    }
  }
}
window.addEventListener("resize",refresh);
window.addEventListener("scroll",refresh,{passive:true});

/* ================= build name letters ================= */
var NAME="ADITYA X";
var nameSpans=[];
for(var ni=0;ni<NAME.length;ni++){
  (function(ch){
    var s=document.createElement("span");
    s.className="lt"; s.textContent = ch===" " ? "\u00A0" : ch;
    nameEl.appendChild(s); nameSpans.push(s); track(s);
  })(NAME[ni]);
}
var caret=document.createElement("span");
caret.className="caret"; nameEl.appendChild(caret);

/* ================= build lyrics ================= */
var WORDS=["Mortui","vivos","docent."];
var wordSpans=WORDS.map(function(w){
  var s=document.createElement("span");
  s.className="w";
  for(var k=0;k<w.length;k++){
    (function(ch){
      var l=document.createElement("span");
      l.className="lt"; l.style.display="inline-block"; l.textContent=ch;
      s.appendChild(l); track(l);
    })(w[k]);
  }
  lyrics.appendChild(s); return s;
});
var wi=-1;
function karaoke(){
  for(var i=0;i<wordSpans.length;i++) wordSpans[i].classList.remove("on");
  wi++;
  if(wi>=wordSpans.length){ wi=-1; setTimeout(karaoke, reduce?0:1700); return; }
  wordSpans[wi].classList.add("on");
  setTimeout(karaoke, reduce?0:780);
}

/* ================= intro sequence =================
   1. type name  2. name fixes  3. white flash  4. video  5. lyrics+icons */
var ti=0;
function typeStep(){
  if(ti<nameSpans.length){
    nameSpans[ti].classList.add("in");
    click(); ti++;
    setTimeout(typeStep, reduce?0:95+Math.random()*80);
  } else {
    sub.classList.add("show");
    setTimeout(doFlash, reduce?0:650);
  }
}
function doFlash(){
  flash.classList.add("on");
  setTimeout(function(){
    bg.classList.add("show"); shade.classList.add("show");
    setTimeout(function(){
      flash.classList.remove("on");
      setTimeout(revealRest, 250);
    }, reduce?0:180);
  }, reduce?0:200);
}
var btns=Array.prototype.slice.call(handles.querySelectorAll(".hbtn"));
btns.forEach(function(b){ b.classList.add("glass"); });
function revealRest(){
  lyrics.classList.add("show");
  setTimeout(karaoke, 500);
  btns.forEach(function(b,i){
    setTimeout(function(){ b.classList.add("pop"); }, i*220);
  });
  setTimeout(function(){ hint.classList.add("show"); }, 1200);
  setTimeout(refresh, 600);
}

/* ================= draggable icons : phone-home-screen style ================= */
var LS="dradityax.iconpos.v1";
var savedPos={};
try{ savedPos=JSON.parse(localStorage.getItem(LS)||"{}"); }catch(e){}
function placeSaved(){
  btns.forEach(function(b,i){
    var p=savedPos[i];
    if(p){
      b.style.position="fixed"; b.style.left=p[0]+"px"; b.style.top=p[1]+"px";
      b.style.right="auto"; b.style.transform="none"; b.style.opacity="1";
    }
  });
}
function savePos(){
  var o={};
  btns.forEach(function(b,i){
    if(b.style.position==="fixed"){ o[i]=[parseFloat(b.style.left),parseFloat(b.style.top)]; }
  });
  try{ localStorage.setItem(LS,JSON.stringify(o)); }catch(e){}
}
btns.forEach(function(b,bi){
  var timer=null, sx=0, sy=0, dragging=false, moved=false, justDragged=false;
  b.addEventListener("pointerdown",function(e){
    if(e.button!==undefined && e.button!==0) return;
    sx=e.clientX; sy=e.clientY; moved=false; dragging=false;
    timer=setTimeout(function(){
      dragging=true; justDragged=true;
      b.classList.add("drag"); handles.classList.add("wiggle");
      var r=b.getBoundingClientRect();
      b.style.position="fixed"; b.style.margin="0";
      moveTo(e.clientX,e.clientY,r.width,r.height);
      b.setPointerCapture && b.setPointerCapture(e.pointerId);
    },450);
  });
  function moveTo(cx,cy,w,h){
    b.style.left=(cx-w/2)+"px"; b.style.top=(cy-h/2)+"px";
    b.style.right="auto"; b.style.transform="none";
  }
  b.addEventListener("pointermove",function(e){
    if(Math.abs(e.clientX-sx)>9||Math.abs(e.clientY-sy)>9) moved=true;
    if(dragging){
      var r=b.getBoundingClientRect();
      moveTo(e.clientX,e.clientY,r.width,r.height);
    }
  });
  function endDrag(e){
    if(timer){ clearTimeout(timer); timer=null; }
    if(dragging){
      dragging=false;
      b.classList.remove("drag"); handles.classList.remove("wiggle");
      savePos();
      setTimeout(function(){ justDragged=false; },80);
      if(e) e.preventDefault();
    }
  }
  b.addEventListener("pointerup",endDrag);
  b.addEventListener("pointercancel",endDrag);
  b.addEventListener("click",function(e){
    if(justDragged){ e.preventDefault(); e.stopPropagation(); return; }
    if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
    e.preventDefault(); e.stopPropagation();
    appOpen(b);
  },true);
});
placeSaved();

/* ================= apple app-open animation ================= */
function appOpen(b){
  var url=b.getAttribute("href"), label=b.getAttribute("aria-label")||"";
  var w=null;
  try{ w=window.open(url,"_blank","noopener"); }catch(e){}
  var r=b.getBoundingClientRect();
  try{
    b.animate(
      [{transform:"scale(1)"},{transform:"scale(1.3)"},{transform:"scale(1)"}],
      {duration:380,easing:"cubic-bezier(.2,1.6,.4,1)"});
  }catch(e){}
  var ov=document.createElement("div");
  ov.className="appopen glass";
  var svg=b.querySelector("svg");
  ov.innerHTML='<div class="ao-logo">'+(svg?svg.outerHTML:"")+'</div><div class="ao-label">'+label+"</div>";
  ov.style.left=r.left+"px"; ov.style.top=r.top+"px";
  ov.style.width=r.width+"px"; ov.style.height=r.height+"px";
  document.body.appendChild(ov);
  void ov.offsetWidth;
  requestAnimationFrame(function(){ ov.classList.add("go"); });
  setTimeout(function(){ ov.classList.add("fade"); },750);
  setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },1250);
  if(!w){ window.location.href=url; }
}

setTimeout(refresh, 2500);
