<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ship picker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#fff;font-family:Arial,sans-serif;min-height:100vh;
 display:flex;flex-direction:column;align-items:center;padding:32px 16px}
h1{font-size:1.1rem;letter-spacing:.2em;font-weight:400;opacity:.85;margin-bottom:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:520px;width:100%}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:18px;
 padding:20px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.card canvas{width:120px;height:120px}
.card span{font-size:.85rem;letter-spacing:.12em;opacity:.8}
.num{font-size:.7rem;opacity:.45;letter-spacing:.2em}
</style></head>
<body>
<h1>PICK YOUR SHIP</h1>
<div class="grid">
  <div class="card"><span class="num">1</span><canvas id="c1" width="240" height="240"></canvas><span>X MASCOT</span></div>
  <div class="card"><span class="num">2</span><canvas id="c2" width="240" height="240"></canvas><span>PAPER PLANE</span></div>
  <div class="card"><span class="num">3</span><canvas id="c3" width="240" height="240"></canvas><span>STAR</span></div>
  <div class="card"><span class="num">4</span><canvas id="c4" width="240" height="240"></canvas><span>UFO</span></div>
  <div class="card"><span class="num">5</span><canvas id="c5" width="240" height="240"></canvas><span>COMET</span></div>
  <div class="card"><span class="num">6</span><canvas id="c6" width="240" height="240"></canvas><span>DIAMOND</span></div>
  <div class="card"><span class="num">7</span><canvas id="c7" width="240" height="240"></canvas><span>LIGHTNING</span></div>
  <div class="card"><span class="num">8</span><canvas id="c8" width="240" height="240"></canvas><span>MOON</span></div>
</div>
<script>
function ctx(id){var c=document.getElementById(id),x=c.getContext('2d');x.translate(120,120);return x;}
var S=3;
function glow(x){x.shadowColor='rgba(255,255,255,.55)';x.shadowBlur=14*S;}
/* 1: X mascot */
(function(){var x=ctx('c1');x.strokeStyle='#fff';x.lineWidth=5*S;x.lineCap='round';glow(x);
var r=10.5*S;x.beginPath();x.moveTo(-r*.72,-r);x.lineTo(r*.72,r);x.moveTo(r*.72,-r);x.lineTo(-r*.72,r);x.stroke();})();
/* 2: paper plane */
(function(){var x=ctx('c2');x.fillStyle='#fff';glow(x);x.beginPath();
x.moveTo(0,-13*S);x.lineTo(9*S,10*S);x.lineTo(0,5*S);x.lineTo(-9*S,10*S);x.closePath();x.fill();
x.shadowBlur=0;x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1.5*S;x.beginPath();x.moveTo(0,-13*S);x.lineTo(0,5*S);x.stroke();})();
/* 3: star */
(function(){var x=ctx('c3');x.fillStyle='#fff';glow(x);var R=12*S,rr=R*.45;x.beginPath();
for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rad=i%2?rr:R;
x[i?'lineTo':'moveTo'](Math.cos(a)*rad,Math.sin(a)*rad);}x.closePath();x.fill();})();
/* 4: UFO */
(function(){var x=ctx('c4');x.fillStyle='#fff';glow(x);
x.beginPath();x.ellipse(0,3*S,13*S,5.5*S,0,0,6.29);x.fill();
x.beginPath();x.arc(0,-2*S,6*S,Math.PI,0);x.fill();
x.shadowBlur=0;x.fillStyle='#0a0a0c';
for(var i=-1;i<=1;i++){x.beginPath();x.arc(i*7*S,3*S,1.8*S,0,6.29);x.fill();}})();
/* 5: comet */
(function(){var x=ctx('c5');x.fillStyle='#fff';glow(x);
x.beginPath();x.arc(0,-9*S,7*S,0,6.29);x.fill();
x.shadowBlur=0;
for(var i=0;i<4;i++){x.globalAlpha=.45-i*.1;
x.beginPath();x.arc(0,(1+i*6.5)*S,(5.5-i*1.1)*S,0,6.29);x.fill();}
x.globalAlpha=1;})();
/* 6: diamond */
(function(){var x=ctx('c6');x.fillStyle='#fff';glow(x);x.beginPath();
x.moveTo(0,-12*S);x.lineTo(9*S,-3*S);x.lineTo(0,12*S);x.lineTo(-9*S,-3*S);x.closePath();x.fill();
x.shadowBlur=0;x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=1.2*S;x.beginPath();
x.moveTo(-9*S,-3*S);x.lineTo(9*S,-3*S);x.moveTo(0,-12*S);x.lineTo(-4*S,-3*S);x.lineTo(0,12*S);
x.moveTo(0,-12*S);x.lineTo(4*S,-3*S);x.lineTo(0,12*S);x.stroke();})();
/* 7: lightning */
(function(){var x=ctx('c7');x.fillStyle='#fff';glow(x);x.beginPath();
x.moveTo(3*S,-13*S);x.lineTo(-7*S,1*S);x.lineTo(-1.5*S,1*S);x.lineTo(-3*S,13*S);
x.lineTo(7*S,-1*S);x.lineTo(1.5*S,-1*S);x.closePath();x.fill();})();
/* 8: crescent moon */
(function(){var x=ctx('c8');x.fillStyle='#fff';glow(x);x.beginPath();
x.arc(0,0,11*S,0,6.29);x.arc(4.5*S,-3*S,9*S,0,6.29);x.fill('evenodd');})();
</script>
</body></html>
