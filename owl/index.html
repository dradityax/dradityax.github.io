<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Noctua — An Aditya X Encounter</title>
<meta name="description" content="Noctua, the night watcher of dradityax — a cursor-tracking owl. Move, and she follows.">
<link rel="canonical" href="https://dradityax.pages.dev/owl/">
<meta property="og:title" content="Noctua — An Aditya X Encounter">
<meta property="og:description" content="The night watcher of dradityax. Move your cursor, and she follows.">
<meta property="og:url" content="https://dradityax.pages.dev/owl/">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#090a0e; --amber:#f5b942; --ink:rgba(255,255,255,.82); --dim:rgba(255,255,255,.45); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Quicksand',sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  /* ---------- loading gate ---------- */
  #gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;transition:opacity .8s ease}
  #gate.done{opacity:0;pointer-events:none}
  #gate .eye{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 50% 50%, #ffd98a 0 18%, #f5b942 18% 34%, #2a1f10 34% 46%, #0c0d12 46% 100%);box-shadow:0 0 40px rgba(245,185,66,.35);animation:blink 3.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  #gate .t{font-size:.72rem;letter-spacing:.45em;text-transform:uppercase;color:var(--dim)}
  #gate .bar{width:min(240px,60vw);height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
  #gate .bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s ease}
  #gate .pct{font-size:.68rem;letter-spacing:.2em;color:var(--dim)}
  /* ---------- header pill ---------- */
  #pill{position:fixed;top:calc(1.1rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px);z-index:20;display:flex;gap:.2rem;padding:.42rem .6rem;border-radius:999px;background:rgba(20,22,30,.42);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);opacity:0;transition:opacity 1s ease .3s, transform 1s ease .3s}
  body.ready #pill{opacity:1;transform:translateX(-50%) translateY(0)}
  #pill a{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:.5rem .95rem;border-radius:999px;transition:color .25s,background .25s}
  #pill a:hover,#pill a.on{color:#fff;background:rgba(255,255,255,.09)}
  /* ---------- hero copy ---------- */
  #copy{position:fixed;left:6vw;bottom:9vh;z-index:20;max-width:360px;opacity:0;transform:translateY(14px);transition:opacity 1.1s ease .5s, transform 1.1s ease .5s;pointer-events:none}
  body.ready #copy{opacity:1;transform:none;pointer-events:auto}
  #copy .kick{font-size:.66rem;letter-spacing:.42em;text-transform:uppercase;color:var(--amber);margin-bottom:.9rem}
  #copy .hi{font-size:1rem;font-weight:500;color:var(--dim);letter-spacing:.06em}
  #copy h1{font-family:'Dancing Script',cursive;font-size:clamp(3.4rem,7vw,5.2rem);line-height:1;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);margin:.2rem 0 .9rem}
  #copy p{font-size:.86rem;line-height:1.65;color:var(--dim);margin-bottom:1.6rem}
  #copy p b{color:var(--ink);font-weight:600}
  .btns{display:flex;gap:.8rem;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:.55rem;font-family:'Quicksand',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:.85rem 1.7rem;border-radius:999px;transition:transform .25s ease, box-shadow .25s ease, background .25s;will-change:transform}
  .btn.solid{background:#fff;color:#0b0c10}
  .btn.solid:hover{box-shadow:0 8px 30px rgba(255,255,255,.22)}
  .btn.glass{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .btn.glass:hover{background:rgba(255,255,255,.14)}
  /* ---------- hint ---------- */
  #hint{position:fixed;right:6vw;bottom:9vh;z-index:20;font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);opacity:0;transition:opacity 1.2s ease 1s;animation:floaty 3s ease-in-out infinite}
  body.ready #hint{opacity:.75}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  /* ---------- custom cursor ---------- */
  #cdot,#cring{position:fixed;top:0;left:0;z-index:60;pointer-events:none;border-radius:50%;display:none}
  #cdot{width:7px;height:7px;background:var(--amber);box-shadow:0 0 14px rgba(245,185,66,.9)}
  #cring{width:38px;height:38px;border:1px solid rgba(245,185,66,.55);transition:width .25s,height .25s,border-color .25s}
  #cring.big{width:64px;height:64px;border-color:rgba(245,185,66,.95)}
  @media (hover:hover) and (pointer:fine){
    body.ready, body.ready a, body.ready .btn{cursor:none}
    #cdot,#cring{display:block}
  }
  @media (max-width:640px){
    #copy{left:7vw;right:7vw;bottom:7vh;max-width:none}
    #copy h1{font-size:3rem}
    #hint{display:none}
    #pill a{padding:.5rem .6rem;letter-spacing:.18em}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="gate" aria-hidden="true">
  <div class="eye"></div>
  <div class="t">Noctua</div>
  <div class="bar"><i id="gfill"></i></div>
  <div class="pct" id="gpct">waking the owl…</div>
</div>

<nav id="pill">
  <a href="../">Home</a>
  <a href="../glacier/">Glacier</a>
  <a href="../experience/">Lumen</a>
</nav>

<div id="copy">
  <div class="kick">An Aditya X encounter</div>
  <div class="hi">Say hello to</div>
  <h1>Noctua</h1>
  <p>The night watcher of <b>dradityax</b>. She sees in the dark — <b>move your cursor</b>, and her gaze follows. Come close, and she'll look you straight in the eye.</p>
  <div class="btns">
    <a class="btn solid mag" href="../">← Home</a>
    <a class="btn glass mag" href="../experience/">Enter Lumen</a>
  </div>
</div>

<div id="hint">move to look around</div>
<div id="cdot"></div><div id="cring"></div>

<script>
(function(){
  "use strict";
  var BG="#090a0e", FW=440, N=64, COLS=8;
  var cv=document.getElementById('stage'), ctx=cv.getContext('2d');
  var gate=document.getElementById('gate'), gfill=document.getElementById('gfill'), gpct=document.getElementById('gpct');
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer=window.matchMedia('(hover:hover) and (pointer:fine)').matches;

  var W=0,H=0,dx=0,dy=0,dw=0,dh=0,fx=0,fy=0;
  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    var s=Math.max(W/FW,H/FW); dw=FW*s; dh=FW*s;
    dx=(W-dw)/2; dy=(H-dh)/2;
    fx=dx+0.5*dw; fy=dy+0.40*dh; /* owl face centre in canvas px */
  }
  window.addEventListener('resize',resize); resize();

  /* ---------- preload ---------- */
  var sprite=new Image(), center=new Image(), loaded=0;
  function prog(){ loaded++; var p=Math.round(loaded/2*100); gfill.style.width=p+'%'; gpct.textContent=p>=100?'she sees you':('waking the owl… '+p+'%'); if(loaded>=2) start(); }
  sprite.onload=prog; sprite.onerror=prog; center.onload=prog; center.onerror=prog;
  sprite.src='frames/sprite.webp'; center.src='frames/center.webp';
  setTimeout(function(){ if(loaded<2){ loaded=2; start(); } },9000); /* fail-safe */

  /* ---------- cursor tracking ---------- */
  var mx=W/2,my=H*0.3,tx=mx,ty=my,lastMove=0,started=false;
  var smooth=-Math.PI/2; /* start looking up = frame 0 */
  function lerpAngle(a,b,t){ var d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return a+d*t; }
  function frameFor(th){
    if(th<-Math.PI*0.75) return N-1;              /* upper-left -> left profile */
    if(th<-Math.PI/2)    return 0;               /* near-upper-left -> up */
    var t=(th+Math.PI/2)/(Math.PI*1.5);
    t=Math.max(0,Math.min(1,t));
    return Math.round(t*(N-1));
  }
  function onMove(x,y){ tx=x; ty=y; mx=x; my=y; lastMove=performance.now(); }
  window.addEventListener('mousemove',function(e){ onMove(e.clientX,e.clientY); },{passive:true});
  window.addEventListener('touchmove',function(e){ var t=e.touches[0]; if(t) onMove(t.clientX,t.clientY); },{passive:true});
  window.addEventListener('touchstart',function(e){ var t=e.touches[0]; if(t) onMove(t.clientX,t.clientY); },{passive:true});

  function draw(idx){
    var col=idx%COLS, row=(idx/COLS)|0;
    ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
    ctx.drawImage(sprite, col*FW, row*FW, FW, FW, dx, dy, dw, dh);
  }
  function drawCenter(){
    ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
    ctx.drawImage(center, dx, dy, dw, dh);
  }

  function loop(now){
    requestAnimationFrame(loop);
    var ddx=tx-fx, ddy=ty-fy;
    var dist=Math.sqrt(ddx*ddx+ddy*ddy);
    var deadR=Math.min(W,H)*0.18;
    if(dist<deadR){ drawCenter(); return; }       /* eye contact */
    var target=Math.atan2(ddy,ddx);
    smooth=lerpAngle(smooth,target,0.26);          /* ~35ms response, zero lag */
    var ang=smooth;
    if(now-lastMove>4000) ang+=Math.sin(now/1600)*0.3;  /* idle sway, alive */
    draw(frameFor(ang));
  }

  function start(){
    if(started) return; started=true;
    gate.classList.add('done'); document.body.classList.add('ready');
    lastMove=performance.now();
    if(reduced){ drawCenter(); return; }
    draw(0); requestAnimationFrame(loop);
  }

  /* ---------- custom magnetic cursor ---------- */
  if(finePointer){
    var dot=document.getElementById('cdot'), ring=document.getElementById('cring');
    var rx=mx,ry=my;
    window.addEventListener('mousemove',function(e){
      dot.style.transform='translate('+(e.clientX-3.5)+'px,'+(e.clientY-3.5)+'px)';
    },{passive:true});
    (function follow(){
      requestAnimationFrame(follow);
      rx+=(mx-rx)*0.16; ry+=(my-ry)*0.16;
      var half=ring.classList.contains('big')?32:19;
      ring.style.transform='translate('+(rx-half)+'px,'+(ry-half)+'px)';
    })();
    document.querySelectorAll('a,.btn').forEach(function(el){
      el.addEventListener('mouseenter',function(){ ring.classList.add('big'); });
      el.addEventListener('mouseleave',function(){ ring.classList.remove('big'); });
    });
    /* magnetic buttons */
    document.querySelectorAll('.mag').forEach(function(b){
      b.addEventListener('mousemove',function(e){
        var r=b.getBoundingClientRect();
        var ox=e.clientX-(r.left+r.width/2), oy=e.clientY-(r.top+r.height/2);
        b.style.transform='translate('+(ox*0.22)+'px,'+(oy*0.28)+'px)';
      });
      b.addEventListener('mouseleave',function(){ b.style.transform=''; });
    });
  }
})();
</script>
</body>
</html>
