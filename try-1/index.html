<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — Footer</title>
<meta name="description" content="Fresh ideas, imagination, and creative collaboration.">
<link rel="icon" type="image/svg+xml" href="/try-1/logo.svg">
<style>
@font-face{font-family:'DM Sans';src:url('/try-1/fonts/DMSans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Epilogue;src:url('/try-1/fonts/Epilogue-Black.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap}
:root{--background:#dfe4f2;--foreground:#080909;font-family:'DM Sans',Arial,sans-serif;font-weight:400;color:var(--foreground);background:var(--background);font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid currentColor;outline-offset:6px}
.footer{position:relative;min-height:100vh;padding-top:6.54vw}
.jobs{margin-left:8.65vw;width:25vw}
.tag{display:inline-flex;align-items:center;border-radius:100px;background:#f7f8fa;padding:.39vw .61vw;font-size:.88vw;line-height:1.2;height:1.9vw;white-space:nowrap}
.headline{font-family:Epilogue,Arial,sans-serif;font-weight:900;font-size:1.66vw;line-height:1.2;letter-spacing:0}
.job-title{display:block;margin-top:1.45vw}
.footer-nav{display:flex;flex-direction:column;align-items:flex-start;gap:.93vw;margin-top:1.3vw;font-size:1.075vw;line-height:1.35}
.logo{position:absolute;left:40.33vw;top:7.7vw;width:17vw}
.logo svg{display:block;width:100%;height:auto}
.contact{position:absolute;left:74.3vw;top:6.54vw}
.contact-links{display:flex;flex-direction:column;align-items:flex-start;margin-top:1.45vw;white-space:nowrap}
.note{margin:1.05vw 0 0;font-size:.733vw;line-height:1.4;white-space:nowrap}
.socials{display:flex;align-items:center;gap:1.43vw;margin-top:1.61vw}
.socials span,.socials img{display:block;width:1.71vw;height:1.71vw}

.footer{isolation:isolate;overflow:hidden}
.footer-background{position:absolute;inset:0;z-index:-1;pointer-events:none}
.footer-background svg{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:pan-y}

@media(max-width:700px){
  :root{--background:#f0eefa;background:var(--background)}
  body{background:var(--background)}
  .footer{display:flex;flex-direction:column;gap:36px;min-height:100svh;padding:40px 24px 0;background:var(--background)}
  .logo{position:static;order:0;align-self:flex-start;width:210px;max-width:75%;margin-bottom:4px}
  .jobs{order:1;margin:0;width:100%}
  .tag{height:30px;padding:6px 11px;font-size:14px}
  .headline{font-size:clamp(22px,6.3vw,30px);line-height:1.25}
  .job-title,.contact-links{margin-top:19px}
  .footer-nav{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:20px;font-size:17px;line-height:1.4}
  .footer-nav span{display:flex;align-items:center;min-height:44px}
  .contact{position:static;order:2;width:100%}
  .contact-links{gap:4px;white-space:normal}
  .note{max-width:34ch;margin:16px 0 0;font-size:14px;line-height:1.5;white-space:normal}
  .socials{gap:18px;margin-top:20px}
  .socials span{display:flex;align-items:center;justify-content:center;width:44px;height:44px}
  .socials img{width:30px;height:30px}
  .socials span:first-child{margin-left:-7px}
  .footer-background{position:relative;inset:auto;order:3;z-index:auto;flex:none;align-self:center;width:calc(100% + 48px);aspect-ratio:4/3;margin-top:-16px}
  .footer-background svg{position:absolute;inset:0;width:100%;height:100%}
}
</style>
</head>
<body>
<footer class="footer" aria-label="Footer">
  <div class="footer-background" aria-hidden="true">
    <!-- Our own coded cutie: a hand-drawn SVG lavender blob holding a pink heart.
         Its eyes genuinely track the pointer (and finger on touch) with easing,
         blinks every few seconds, and drifts gently when idle. No video, no scrub. -->
    <svg id="cutieScene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="bodyGrad" cx="50%" cy="32%" r="78%">
          <stop offset="0%" stop-color="#ded4f4"/>
          <stop offset="58%" stop-color="#c9b9ee"/>
          <stop offset="100%" stop-color="#b3a0e4"/>
        </radialGradient>
        <radialGradient id="heartGrad" cx="50%" cy="32%" r="82%">
          <stop offset="0%" stop-color="#f8c4da"/>
          <stop offset="100%" stop-color="#efa1c1"/>
        </radialGradient>
        <filter id="fuzz" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="44"/>
        </filter>
        <filter id="fuzzSoft" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="24"/>
        </filter>
        <filter id="grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" stitchTiles="stitch"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.34  0 0 0 0 0.62  0 0 0 0.07 0"/>
        </filter>
        <clipPath id="bodyClip">
          <path d="M960 250 C1195 250 1345 430 1345 665 C1345 890 1170 1020 960 1020 C750 1020 575 890 575 665 C575 430 725 250 960 250 Z"/>
        </clipPath>
      </defs>

      <!-- ground shadow -->
      <ellipse cx="960" cy="1032" rx="440" ry="38" fill="#7d6bad" opacity="0.22"/>
      <!-- feet -->
      <ellipse cx="820" cy="992" rx="80" ry="44" fill="#b3a0e2"/>
      <ellipse cx="1100" cy="992" rx="80" ry="44" fill="#b3a0e2"/>
      <!-- fuzzy body -->
      <g filter="url(#fuzz)">
        <ellipse cx="728" cy="298" rx="68" ry="88" fill="#c2aee8" transform="rotate(-18 728 298)"/>
        <ellipse cx="1192" cy="298" rx="68" ry="88" fill="#c2aee8" transform="rotate(18 1192 298)"/>
        <path d="M960 250 C1195 250 1345 430 1345 665 C1345 890 1170 1020 960 1020 C750 1020 575 890 575 665 C575 430 725 250 960 250 Z" fill="url(#bodyGrad)"/>
      </g>
      <!-- felt grain, clipped inside the body -->
      <g clip-path="url(#bodyClip)">
        <rect x="520" y="200" width="880" height="880" filter="url(#grain)"/>
      </g>
      <!-- blush -->
      <ellipse cx="688" cy="662" rx="42" ry="26" fill="#f2a3c4" opacity="0.5"/>
      <ellipse cx="1232" cy="662" rx="42" ry="26" fill="#f2a3c4" opacity="0.5"/>
      <!-- brows -->
      <path d="M742 402 Q800 376 858 402" stroke="#d9a05f" stroke-width="16" stroke-linecap="round" fill="none"/>
      <path d="M1062 402 Q1120 376 1178 402" stroke="#d9a05f" stroke-width="16" stroke-linecap="round" fill="none"/>
      <!-- arms (behind the heart) -->
      <path d="M648 768 C702 800 762 816 822 822" stroke="#a68fd8" stroke-width="56" stroke-linecap="round" fill="none"/>
      <path d="M1272 768 C1218 800 1158 816 1098 822" stroke="#a68fd8" stroke-width="56" stroke-linecap="round" fill="none"/>
      <!-- heart -->
      <path d="M960 955 C855 875 785 800 785 718 C785 658 832 622 884 622 C921 622 951 644 960 672 C969 644 999 622 1036 622 C1088 622 1135 658 1135 718 C1135 800 1065 875 960 955 Z"
            fill="url(#heartGrad)" filter="url(#fuzzSoft)"/>
      <ellipse cx="878" cy="706" rx="28" ry="44" fill="#ffffff" opacity="0.35" transform="rotate(-18 878 706)"/>
      <!-- eyes -->
      <g id="lidL">
        <ellipse cx="800" cy="545" rx="98" ry="112" fill="#fffdf9"/>
        <ellipse cx="800" cy="545" rx="98" ry="112" fill="none" stroke="#e6d9f6" stroke-width="6"/>
        <g id="pupilL">
          <circle cx="800" cy="545" r="44" fill="#262032"/>
          <circle cx="784" cy="528" r="15" fill="#ffffff" opacity="0.95"/>
          <circle cx="815" cy="561" r="7" fill="#ffffff" opacity="0.5"/>
        </g>
      </g>
      <g id="lidR">
        <ellipse cx="1120" cy="545" rx="98" ry="112" fill="#fffdf9"/>
        <ellipse cx="1120" cy="545" rx="98" ry="112" fill="none" stroke="#e6d9f6" stroke-width="6"/>
        <g id="pupilR">
          <circle cx="1120" cy="545" r="44" fill="#262032"/>
          <circle cx="1104" cy="528" r="15" fill="#ffffff" opacity="0.95"/>
          <circle cx="1135" cy="561" r="7" fill="#ffffff" opacity="0.5"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="jobs">
    <span class="tag">have a fresh idea?</span>
    <span class="headline job-title">imagination<br>meets craft</span>
    <div class="footer-nav">
      <span>Made</span>
      <span>Story</span>
      <span>In the lab</span>
      <span>Say hey</span>
    </div>
  </div>
  <div class="logo" role="img" aria-label="Studio logo">
    <!-- TEMPORARY stand-in: the supplied BrandLogo SVG (outlined script Logoipsum, 169x40 viewBox)
         was truncated in Aditya's paste and never recovered. Swap in the exact path when supplied.
         Inline copy uses fill="currentColor" (#080909); standalone /try-1/logo.svg uses #080909. -->
    <svg viewBox="0 0 169 40" aria-hidden="true" focusable="false">
      <text x="84.5" y="28" text-anchor="middle" font-family="'Snell Roundhand','Brush Script MT','Segoe Script','Apple Chancery',cursive" font-size="30" font-style="italic" fill="currentColor">studio</text>
    </svg>
  </div>
  <div class="contact">
    <span class="tag">say hey</span>
    <div class="headline contact-links">
      <span>let’s team up!</span>
      <span>bring us your idea*</span>
    </div>
    <p class="note">*good things start with one spark. let’s make yours.</p>
    <div class="socials">
      <span aria-label="LinkedIn"><img src="/try-1/linkedin.svg" alt="" width="35" height="35"></span>
      <span aria-label="Instagram"><img src="/try-1/instagram.svg" alt="" width="35" height="35"></span>
      <span aria-label="TikTok"><img src="/try-1/tiktok.svg" alt="" width="35" height="35"></span>
    </div>
  </div>
</footer>
<script>
(function () {
  'use strict';
  var svg = document.getElementById('cutieScene');
  var pupils = [document.getElementById('pupilL'), document.getElementById('pupilR')];
  var lids = [document.getElementById('lidL'), document.getElementById('lidR')];
  var eyes = [{ cx: 800, cy: 545 }, { cx: 1120, cy: 545 }];
  var MAX_TRAVEL = 42; // pupil travel in SVG units
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  var target = { x: 960, y: 545 }; // look target in SVG coords; starts looking forward
  var cur = [{ x: 0, y: 0 }, { x: 0, y: 0 }];
  var hasPointer = false;
  var lastPointer = 0;
  var t0 = performance.now();
  var pt = svg.createSVGPoint();

  function toSVG(clientX, clientY) {
    var ctm = svg.getScreenCTM();
    if (!ctm) return null;
    pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(ctm.inverse());
  }
  function onMove(e) {
    var p = toSVG(e.clientX, e.clientY);
    if (!p) return;
    target.x = p.x; target.y = p.y;
    hasPointer = true;
    lastPointer = performance.now();
  }
  window.addEventListener('pointermove', onMove, { passive: true });

  // Blink state
  var blinking = false, blinkT = 0, nextBlink = 2200 + Math.random() * 2500;
  function setLidScale(s) {
    lids[0].setAttribute('transform', 'translate(800 545) scale(1 ' + s.toFixed(3) + ') translate(-800 -545)');
    lids[1].setAttribute('transform', 'translate(1120 545) scale(1 ' + s.toFixed(3) + ') translate(-1120 -545)');
  }
  function clearLids() {
    lids[0].removeAttribute('transform');
    lids[1].removeAttribute('transform');
  }

  var last = 0;
  function frame(now) {
    var dt = Math.min(50, now - (last || now));
    last = now;

    // Idle: gentle gaze drift so the cutie feels alive (never a constant spin).
    var idle = !hasPointer || (now - lastPointer > 5000);
    var tx = target.x, ty = target.y;
    if (idle) {
      if (reduced.matches) { tx = 960; ty = 545; }
      else {
        var s = (now - t0) / 1000;
        tx = 960 + Math.sin(s * 0.5) * 70;
        ty = 545 + Math.cos(s * 0.34) * 34;
      }
    }

    for (var i = 0; i < 2; i++) {
      var dx = tx - eyes[i].cx, dy = ty - eyes[i].cy;
      var d = Math.hypot(dx, dy) || 1;
      var travel = Math.min(d, MAX_TRAVEL);
      var ox = (dx / d) * travel, oy = (dy / d) * travel;
      cur[i].x += (ox - cur[i].x) * 0.14;
      cur[i].y += (oy - cur[i].y) * 0.14;
      pupils[i].setAttribute('transform', 'translate(' + cur[i].x.toFixed(2) + ' ' + cur[i].y.toFixed(2) + ')');
    }

    if (!reduced.matches) {
      if (!blinking && now > nextBlink) { blinking = true; blinkT = 0; }
      if (blinking) {
        blinkT += dt;
        var ph = blinkT / 260;
        var k = ph < 0.5 ? ph * 2 : (1 - ph) * 2;
        setLidScale(1 - 0.92 * Math.max(0, Math.min(1, k)));
        if (ph >= 1) {
          blinking = false;
          clearLids();
          nextBlink = now + 2400 + Math.random() * 3200;
        }
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
