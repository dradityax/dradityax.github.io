<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap');
  :root{
    --ink-rgb:27,36,48; --bg-rgb:237,240,244; --accent-rgb:15,118,110;
    --bg:#edf0f4; --ink:#1b2430; --accent:#0f766e; --accent-ink:#ffffff;
    --panel:rgba(255,255,255,.94); --panel-solid:#ffffff;
  }
  html.dark{
    --ink-rgb:233,237,242; --bg-rgb:11,13,16; --accent-rgb:45,212,191;
    --bg:#0b0d10; --ink:#e9edf2; --accent:#2dd4bf; --accent-ink:#052e29;
    --panel:rgba(20,25,32,.94); --panel-solid:#141920;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:'Quicksand',sans-serif;overscroll-behavior:none}
  #scene{position:fixed;inset:0}
  #scene canvas{display:block;touch-action:none}
  /* top bar */
  #top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem;z-index:10;pointer-events:none;background:linear-gradient(to bottom,rgba(var(--bg-rgb),.92),rgba(var(--bg-rgb),0))}
  #top a,#top button{pointer-events:auto}
  .back{color:rgba(var(--ink-rgb),.6);text-decoration:none;font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
  .back:hover{color:var(--accent)}
  .title{text-align:center}
  .title h1{font-size:1rem;font-weight:700;letter-spacing:.26em;color:var(--ink)}
  .title p{font-size:.64rem;letter-spacing:.16em;color:rgba(var(--ink-rgb),.5);margin-top:.22rem;text-transform:uppercase;font-weight:500}
  .topbtns{display:flex;gap:.6rem;align-items:center;pointer-events:auto}
  .iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(var(--ink-rgb),.16);background:var(--panel);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(var(--ink-rgb),.08)}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
  .iconbtn svg{width:20px;height:20px}
  /* search panel */
  #searchPanel{position:fixed;top:4.4rem;right:1rem;width:min(320px,calc(100vw - 2rem));background:var(--panel);border:1px solid rgba(var(--ink-rgb),.1);border-radius:14px;z-index:20;display:none;overflow:hidden;box-shadow:0 12px 40px rgba(var(--ink-rgb),.14);backdrop-filter:blur(8px)}
  #searchPanel.open{display:block}
  #searchInput{width:100%;padding:.85rem 1rem;background:transparent;border:none;border-bottom:1px solid rgba(var(--ink-rgb),.1);color:var(--ink);font-family:inherit;font-size:.95rem;outline:none}
  #results{max-height:46vh;overflow-y:auto}
  .res{padding:.8rem 1rem;min-height:48px;font-size:.88rem;cursor:pointer;border-bottom:1px solid rgba(var(--ink-rgb),.05);display:flex;justify-content:space-between;align-items:center;gap:.6rem;color:var(--ink)}
  .res:hover{background:rgba(var(--accent-rgb),.12)}
  .res .rg{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--ink-rgb),.45);white-space:nowrap;font-weight:600}
  .nores{padding:1rem;color:rgba(var(--ink-rgb),.45);font-size:.85rem;text-align:center}
  /* region dropdown */
  #regionWrap{position:fixed;top:4.6rem;left:1rem;z-index:12}
  #regionBtn{display:flex;align-items:center;gap:.55rem;padding:.55rem 1.1rem;min-height:44px;border-radius:999px;border:1px solid rgba(var(--ink-rgb),.14);background:var(--panel);color:var(--ink);font-family:inherit;font-size:.8rem;font-weight:700;letter-spacing:.05em;cursor:pointer;box-shadow:0 2px 10px rgba(var(--ink-rgb),.08)}
  #regionBtn .caret{font-size:.68rem;color:var(--accent)}
  #regionMenu{position:absolute;top:calc(100% + .45rem);left:0;min-width:200px;background:var(--panel-solid);border:1px solid rgba(var(--ink-rgb),.1);border-radius:14px;box-shadow:0 14px 40px rgba(var(--ink-rgb),.16);overflow:hidden;display:none}
  #regionMenu.open{display:block}
  #regionMenu button{display:flex;width:100%;padding:.85rem 1.15rem;min-height:50px;background:none;border:none;border-bottom:1px solid rgba(var(--ink-rgb),.06);font-family:inherit;font-size:.88rem;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;align-items:center}
  #regionMenu button:last-child{border-bottom:none}
  #regionMenu button.on{color:var(--accent)}
  #regionMenu button.on::after{content:'✓';margin-left:auto;font-weight:700}
  /* info card */
  #card{position:fixed;left:50%;transform:translate(-50%,130%);bottom:calc(1.2rem + env(safe-area-inset-bottom));width:min(500px,calc(100vw - 2rem));max-height:46vh;overflow-y:auto;background:var(--panel);border:1px solid rgba(var(--ink-rgb),.1);border-radius:18px;padding:1.15rem 1.3rem calc(1.1rem + env(safe-area-inset-bottom));z-index:20;transition:transform .38s cubic-bezier(.2,.9,.25,1.08);box-shadow:0 18px 50px rgba(var(--ink-rgb),.18);backdrop-filter:blur(8px)}
  #card.show{transform:translate(-50%,0)}
  #isoRow{display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem}
  #card .rg{display:inline-block;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:.24rem .75rem;font-weight:700}
  #isolateBtn{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:.32rem .95rem;min-height:36px;font-family:inherit;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  #isolateBtn.on{background:var(--accent);color:var(--accent-ink)}
  #card h2{font-size:1.3rem;font-weight:700;letter-spacing:.01em;color:var(--ink)}

  /* hint */
  #hint{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:.68rem;letter-spacing:.13em;color:rgba(var(--ink-rgb),.42);z-index:5;pointer-events:none;text-transform:uppercase;transition:opacity .6s;white-space:nowrap;font-weight:600}
  #hint.gone{opacity:0}
  /* locator */
  #locator{position:fixed;right:1rem;bottom:calc(3.4rem + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:1px solid rgba(var(--ink-rgb),.14);background:var(--panel);color:var(--ink);font-size:1.45rem;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(var(--ink-rgb),.12)}
  #locator:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.06)}
  #locator:active{transform:scale(.96)}
  /* isolate pill */
  #isoPill{position:fixed;top:8.2rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:.5rem .55rem .5rem 1.05rem;font-size:.78rem;font-weight:600;display:none;align-items:center;gap:.65rem;z-index:18;box-shadow:0 8px 24px rgba(var(--ink-rgb),.28);white-space:nowrap;max-width:calc(100vw - 2rem)}
  #isoPill.show{display:flex}
  #isoPill span{overflow:hidden;text-overflow:ellipsis}
  #isoExit{background:rgba(var(--bg-rgb),.18);border:none;color:var(--bg);min-width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center}
  /* attribution */
  #attr{position:fixed;bottom:.55rem;right:.8rem;font-size:.58rem;color:rgba(var(--ink-rgb),.34);z-index:5;letter-spacing:.03em;text-align:right;line-height:1.5}
  /* loader */
  #loader{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;transition:opacity .7s}
  #loader.done{opacity:0;pointer-events:none}
  #loader h1{font-size:1.35rem;font-weight:300;letter-spacing:.4em;color:var(--ink)}
  #loader .sub{font-size:.68rem;letter-spacing:.24em;color:rgba(var(--ink-rgb),.45);text-transform:uppercase;font-weight:600}
  #barw{width:min(280px,70vw);height:2px;background:rgba(var(--ink-rgb),.12);border-radius:2px;overflow:hidden}
  #bar{height:100%;width:0%;background:var(--accent);transition:width .2s}
  #pct{font-size:.72rem;letter-spacing:.2em;color:rgba(var(--ink-rgb),.5);font-weight:600}
  #err{display:none;max-width:80vw;text-align:center;color:#b33737;font-size:.85rem;line-height:1.6}
  @media (max-width:480px){
    .title h1{font-size:.8rem;letter-spacing:.16em}
    .title p{font-size:.54rem;letter-spacing:.12em}
    #top{padding:.7rem .9rem}
    #regionWrap{top:4.2rem}
    #searchPanel{top:4rem}
    #isoPill{top:7.8rem;font-size:.72rem}
    #card h2{font-size:1.12rem}
    #card p{font-size:.84rem}
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------- theme toggle (dark / light) ---------- */
const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function setTheme(mode){
  const dark = mode === 'dark';
  document.documentElement.classList.toggle('dark', dark);
  scene.background.set(dark ? 0x0b0d10 : 0xedf0f4);
  $('themeBtn').innerHTML = dark ? SUN_SVG : MOON_SVG;
  $('themeBtn').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  try{ localStorage.setItem('p2-theme', mode); }catch(_){}
}
$('themeBtn').onclick = ()=> setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
setTheme(document.documentElement.classList.contains('dark') ? 'dark' : 'light');

/* ---------- descriptions (standard anatomy) ---------- */
const DESC = {
  "atlas":"The first cervical vertebra (C1). It has no body or spinous process — just a bony ring that cradles the skull. The nodding 'yes' joint sits between the atlas and the occipital bone. Injury here is dangerous, because the spinal cord passes straight through its ring.",
  "axis":"The second cervical vertebra (C2). Its peg-like dens (odontoid process) pivots inside the atlas, letting the head turn side to side — the shaking-'no' joint. A broken dens can threaten the spinal cord, which is why neck injuries are always immobilized.",
  "frontal bone":"Forms the forehead and the roofs of the eye sockets. Its air-filled frontal sinuses lighten the skull and add resonance to the voice. It also forms the front wall of the cranial cavity holding the frontal lobes.",
  "occipital bone":"Forms the back and base of the skull. The spinal cord passes through its large opening, the foramen magnum, and the skull rocks on its two occipital condyles. The bump you feel at the back of your head is its external occipital protuberance.",
  "sphenoid bone":"The butterfly-shaped keystone at the base of the skull. It cradles the pituitary gland in a little saddle called the sella turcica. Almost every other skull bone touches the sphenoid — it is the true keystone of the cranium.",
  "ethmoid":"A light, spongy cube of bone between the eyes. It forms the roof of the nasal cavity and the inner walls of the eye sockets. Its tiny holes let the smell nerves pass from the nose up to the brain.",
  "mandible":"The largest and strongest facial bone — and the only movable bone of the skull. It carries the lower teeth and anchors the powerful chewing muscles, which exert the strongest bite force in the body.",
  "vomer":"The thin, plough-shaped bone forming the lower part of the nasal septum. A bent or deviated vomer is a common cause of a chronically blocked nose.",
  "hyoid bone":"A U-shaped bone in the neck that touches no other bone — it floats, slung by muscles, and supports the tongue. It glides upward with every swallow; you can feel it move if you touch your throat while swallowing.",
  "manubrium":"The broad top plate of the breastbone. Both collarbones and the first pair of ribs meet it here, and doctors use it as a landmark when placing a stethoscope.",
  "body of sternum":"The long middle plate of the breastbone. Ribs 2 to 7 anchor to it through their cartilages. Its marrow-rich interior is one of the sites where bone-marrow samples are taken.",
  "xiphoid process":"The small, cartilaginous tip of the breastbone. It slowly hardens into bone with age. Rescuers are trained to avoid pressing on it during CPR, since the liver sits just beneath.",
  "clavicle":"The collarbone — a slender S-shaped strut between breastbone and shoulder. It is the most commonly fractured bone in the body, and the first bone to harden in a fetus, finishing growth only around age 25.",
  "scapula":"The flat, triangular shoulder blade gliding over the ribcage. It anchors 17 muscles and its shallow socket holds the arm bone. Its flat shape lets it slide smoothly as the arm moves.",
  "humerus":"The long bone of the upper arm. Its rounded head fits the shoulder socket; its pulley-shaped lower end forms the elbow with the forearm bones. The 'funny bone' tingle is actually the ulnar nerve getting pinched behind it.",
  "radius":"The outer forearm bone (thumb side). It rolls around the ulna when you turn your palm up or down. It is the most commonly broken arm bone — typically from falling on an outstretched hand.",
  "ulna":"The inner forearm bone (little-finger side). Its hooked upper end forms the point of the elbow, making a strong hinge with the humerus that bends only one way.",
  "hip bone":"The large fused bone of the pelvis — ilium, ischium and pubis joined into one. Its deep socket (acetabulum) cradles the head of the femur, and its wide flare is built for upright walking.",
  "femur":"The thigh bone — the longest and strongest bone in the human body, carrying the body's weight down to the knee. It can bear many times the body weight; engineers study its structure to design stronger materials.",
  "patella":"The kneecap — a sesamoid bone floating inside the quadriceps tendon. It shields the knee joint and boosts the thigh muscle's pulling power by up to fifty percent.",
  "tibia":"The shinbone — the thick inner bone of the lower leg that carries nearly all of its weight. Its sharp front edge is the shin you bang against furniture.",
  "fibula":"The slender outer bone of the lower leg. It bears little weight but steadies the ankle and anchors leg muscles. Surgeons sometimes use a piece of it to rebuild jaws after injury.",
  "talus":"The ankle bone that receives the body's full weight from the tibia and passes it down into the foot. Unusually, no muscles attach to it — it is steered entirely by surrounding bones and ligaments.",
  "calcaneus":"The heel bone — the largest bone of the foot, striking the ground with every step you take. The Achilles tendon, the strongest tendon in the body, anchors into it."
};
function describe(name){
  const n = name.toLowerCase().replace(/ \(2\)$/,'');
  const base = n.replace(/^(left|right) /,'');
  if (DESC[n]) return DESC[n];
  if (DESC[base]) return DESC[base];
  if (/parietal bone/.test(n)) return "Paired bones forming the sides and roof of the cranium. They meet along the sagittal suture at the very top of the skull — the soft spot on a baby's head sits where they meet the frontal bone.";
  if (/temporal bone/.test(n)) return "Forms the sides and base of the skull. It houses the delicate middle and inner ear, and its bony mastoid process behind the ear anchors neck muscles.";
  if (/maxilla/.test(n)) return "Forms the upper jaw and holds the upper teeth. Its hollow maxillary sinus is the largest of the facial air sinuses — the one that aches during sinus infections.";
  if (/zygomatic bone/.test(n)) return "The cheekbone — forms the prominence of the cheek and the outer rim of the eye socket. Its arch is a favorite fracture site in facial injuries.";
  if (/nasal bone/.test(n)) return "Paired small bones forming the bridge of the nose — and the most commonly broken bones of the face.";
  if (/lacrimal bone/.test(n)) return "The smallest bone of the skull, at the inner corner of each eye socket. Tears drain through a tiny groove in it into the nose — which is why crying gives you a runny nose.";
  if (/palatine bone/.test(n)) return "L-shaped bones forming the back of the hard palate — the roof of the mouth — and part of the nasal cavity wall.";
  if (/rib/.test(n)) return "One of 12 pairs of curved bones guarding the chest. The upper 7 join the breastbone directly; ribs 8–10 join the cartilage above; 11–12 float free. They rise and fall with every breath.";
  if (/cervical vertebra/.test(n)) return "One of the 7 neck vertebrae (C1–C7) — the smallest and most mobile vertebrae of the whole spine, built for the head's wide range of motion.";
  if (/thoracic vertebra/.test(n)) return "One of the 12 chest vertebrae (T1–T12). Each carries small facets where a pair of ribs attaches — the only vertebrae that join ribs directly.";
  if (/lumbar vertebra/.test(n)) return "One of the 5 lower-back vertebrae (L1–L5) — the largest vertebrae in the spine, built to carry the body's weight. Most slipped discs happen here.";
  if (/scaphoid|lunate|pisiform|trapezium|trapezoid|capitate|hamate/.test(n)) return "One of the 8 small carpal bones of the wrist, packed in two rows of four between the forearm and the hand. The scaphoid is the most commonly fractured wrist bone.";
  if (/metacarpal/.test(n)) return "One of the 5 long bones of the palm, numbered 1 to 5 from thumb to little finger. The fifth metacarpal is the classic 'boxer's fracture' bone.";
  if (/metatarsal/.test(n)) return "One of the 5 long bones of the forefoot, between the ankle and the toes. They take a pounding with every step — stress fractures here are common in runners.";
  if (/navicular|cuboid|cuneiform/.test(n)) return "One of the 7 tarsal bones of the ankle, interlocking to form the arch of the foot — the spring that absorbs each step.";
  if (/phalanx/.test(n)) return /finger|thumb/.test(n)
    ? "A finger bone. Each finger has three phalanges (proximal, middle, distal); the thumb has only two — a trade-off for its powerful grip."
    : "A toe bone. Each toe has three phalanges (proximal, middle, distal); the big toe has only two, built sturdier for push-off.";
  if (/sesamoid/.test(n)) return "A small bone embedded inside a tendon — like a miniature kneecap protecting a high-stress joint.";
  return "Part of the human skeleton — " + regionOf(name) + " region.";
}
function regionOf(name){
  const n = name.toLowerCase();
  if (/frontal|parietal|temporal|occipital|sphenoid|ethmoid|mandible|maxilla|zygomatic|nasal|lacrimal|palatine|vomer|hyoid/.test(n)) return 'Skull';
  if (/vertebra|atlas|axis/.test(n)) return 'Spine';
  if (/rib|sternum|manubrium|xiphoid/.test(n)) return 'Thorax';
  if (/clavicle|scapula|humerus|radius|ulna|scaphoid|lunate|pisiform|trapezium|trapezoid|capitate|hamate|metacarpal|finger|thumb/.test(n)) return 'Arm';
  if (/hip bone|femur|patella|tibia|fibula|talus|calcaneus|navicular|cuboid|cuneiform|metatarsal|toe|sesamoid/.test(n)) return 'Leg';
  return 'Other';
}
const titleCase = s => s.replace(/ \(2\)$/,'').replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.slice(1));

/* ---------- scene ---------- */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xedf0f4);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 1, 30000);
const HOME_POS = new THREE.Vector3(750, 1050, 3050);
const HOME_TGT = new THREE.Vector3(0, 800, 0);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 250;
controls.maxDistance = 9000;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfd6df, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(1400, 2400, 2000); scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd4ff, 0.55); rim.position.set(-1600, 900, -2000); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(0, 500, 2600); scene.add(fill);

const boneMat = new THREE.MeshStandardMaterial({color:0xf6f6f6, roughness:0.5, metalness:0.04});
const dimMat  = new THREE.MeshStandardMaterial({color:0x9aa0a8, roughness:0.8, metalness:0, transparent:true, opacity:0.06, depthWrite:false});
const selMat  = new THREE.MeshStandardMaterial({color:0x0f766e, roughness:0.4, metalness:0.1, emissive:0x0f766e, emissiveIntensity:0.35});

const skel = new THREE.Group();
skel.rotation.x = -Math.PI/2;
scene.add(skel);

/* soft ground shadow */
(function(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128,128,8,128,128,122);
  gr.addColorStop(0,'rgba(27,36,48,0.30)'); gr.addColorStop(1,'rgba(27,36,48,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  const sh = new THREE.Mesh(
    new THREE.PlaneGeometry(1150,1150),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false})
  );
  sh.rotation.x = -Math.PI/2; sh.position.y = -80;
  scene.add(sh);
})();

const bones = [];
let selected = null;
let activeRegion = 'All';
let isolated = null;

/* ---------- UI refs ---------- */
const $ = id => document.getElementById(id);
const card=$('card'), cardName=$('cardName'), cardFact=$('cardFact'), cardRegion=$('cardRegion');
const hint=$('hint'), results=$('results'), searchInput=$('searchInput'), searchPanel=$('searchPanel');

function select(bone, focus){
  if (selected) selected.mesh.material = (activeRegion==='All'||selected.region===activeRegion) ? boneMat : dimMat;
  selected = bone;
  if (bone){
    bone.mesh.material = selMat;
    cardName.textContent = titleCase(bone.name);
    cardFact.textContent = describe(bone.name);
    cardRegion.textContent = bone.region;
    card.classList.add('show');
    hint.classList.add('gone');
    if (focus) focusBone(bone);
  } else {
    card.classList.remove('show');
  }
  if (bone && isolated) setIsolated(bone); else syncIsoBtn();
}
$('cardClose').onclick = () => select(null);

let tween = null;
function flyTo(toT, toC){
  tween = {t:0, fromT:controls.target.clone(), toT:toT.clone(), fromC:camera.position.clone(), toC:toC.clone()};
}
function focusBone(bone){
  const box = new THREE.Box3().setFromObject(bone.mesh);
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  skel.updateWorldMatrix(true,true);
  const wc = c.clone().applyMatrix4(skel.matrixWorld);
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = Math.max(size*2.8, 430);
  flyTo(wc, wc.clone().add(dir.multiplyScalar(dist)));
}

/* locator — back to the original view */
$('locator').onclick = ()=>{
  select(null);
  if (isolated) setIsolated(null);
  controls.autoRotate = true;
  flyTo(HOME_TGT, HOME_POS);
};

/* isolate — show one bone alone, camera flies to it */
function syncIsoBtn(){
  const on = !!(isolated && selected && isolated===selected);
  $('isolateBtn').textContent = on ? 'Show all' : 'Isolate';
  $('isolateBtn').classList.toggle('on', on);
}
function setIsolated(bone){
  isolated = bone;
  bones.forEach(b=>{ b.mesh.visible = !bone || b===bone; });
  if (bone){
    $('isoName').textContent = 'Isolated: ' + titleCase(bone.name);
    $('isoPill').classList.add('show');
    focusBone(bone);
  } else {
    $('isoPill').classList.remove('show');
    applyRegion();
  }
  syncIsoBtn();
}
$('isolateBtn').onclick = ()=>{
  if (!selected) return;
  setIsolated(isolated===selected ? null : selected);
};
$('isoExit').onclick = ()=> setIsolated(null);

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downX=0, downY=0, downT=0;
renderer.domElement.addEventListener('pointerdown', e => { downX=e.clientX; downY=e.clientY; downT=Date.now(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 8 || Date.now()-downT > 600) return;
  ptr.x = (e.clientX/innerWidth)*2-1;
  ptr.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(bones.map(b=>b.mesh), false);
  if (hits.length){
    const bone = bones.find(b=>b.mesh===hits[0].object);
    if (bone) select(bone, false);
  } else select(null);
});

let rotTimer=null;
controls.addEventListener('start', ()=>{ controls.autoRotate=false; clearTimeout(rotTimer); });
controls.addEventListener('end', ()=>{ clearTimeout(rotTimer); rotTimer=setTimeout(()=>controls.autoRotate=true, 6000); });

/* regions */
function applyRegion(){
  bones.forEach(b=>{
    const vis = activeRegion==='All' || b.region===activeRegion;
    b.mesh.material = (selected===b) ? selMat : (vis ? boneMat : dimMat);
    if (!isolated) b.mesh.visible = true;
  });
}
const regionBtn=$('regionBtn'), regionMenu=$('regionMenu'), regionName=$('regionName');
regionBtn.onclick = e=>{ e.stopPropagation(); regionMenu.classList.toggle('open'); };
document.addEventListener('click', e=>{ if(!regionMenu.contains(e.target) && e.target!==regionBtn) regionMenu.classList.remove('open'); });
regionMenu.querySelectorAll('button').forEach(b=>{
  b.onclick = ()=>{
    regionMenu.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    regionName.textContent = b.textContent;
    regionMenu.classList.remove('open');
    if (isolated) setIsolated(null);
    activeRegion = b.dataset.r;
    applyRegion();
  };
});

/* search */
$('searchBtn').onclick = ()=>{
  searchPanel.classList.toggle('open');
  if (searchPanel.classList.contains('open')){ searchInput.value=''; renderResults(''); searchInput.focus(); }
};
function renderResults(q){
  q = q.trim().toLowerCase();
  const list = bones.filter(b=>!q || b.name.toLowerCase().includes(q)).slice(0,60);
  results.innerHTML = list.length
    ? list.map(b=>`<div class="res" data-i="${bones.indexOf(b)}"><span>${titleCase(b.name)}</span><span class="rg">${b.region}</span></div>`).join('')
    : `<div class="nores">No bone found for &ldquo;${q}&rdquo;.</div>`;
  results.querySelectorAll('.res').forEach(el=>{
    el.onclick = ()=>{
      searchPanel.classList.remove('open');
      select(bones[+el.dataset.i], true);
    };
  });
}
searchInput.addEventListener('input', e=>renderResults(e.target.value));

/* ---------- load ---------- */
const manager = new THREE.LoadingManager();
const bar=$('bar'), pct=$('pct');
manager.onProgress = (u,loaded,total)=>{ const p=Math.round(loaded/total*100); bar.style.width=p+'%'; pct.textContent=p+'%'; };
manager.onError = ()=>{ $('err').style.display='block'; $('err').textContent='Could not load the 3D model. Check your connection and reload.'; };

new GLTFLoader(manager).load('../models/skeleton_full.glb', gltf=>{
  gltf.scene.traverse(o=>{
    if (o.isMesh){
      const name = (o.name||'bone').toLowerCase();
      o.material = boneMat;
      bones.push({mesh:o, name, region:regionOf(name)});
    }
  });
  skel.add(gltf.scene);
  bones.sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('loader').classList.add('done');
  setTimeout(()=>hint.classList.add('gone'), 9000);
}, undefined, ()=>{
  $('err').style.display='block';
  $('err').textContent='Could not load the 3D model. Check your connection and reload.';
});

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (tween){
    tween.t += dt/0.55;
    const k = tween.t>=1 ? 1 : 1-Math.pow(1-tween.t,3);
    controls.target.lerpVectors(tween.fromT, tween.toT, k);
    camera.position.lerpVectors(tween.fromC, tween.toC, k);
    if (tween.t>=1) tween=null;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
